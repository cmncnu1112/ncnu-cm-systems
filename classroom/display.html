<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
  ===== GitHub Pages 版設定（2026-11 由 GAS HtmlService 搬出）：教室狀態看板（1920×1080） =====
  1. GAS 後端網址統一寫在同資料夾的 config.js，四個頁面共用，只需改一處。
  2. gas-shim.js 模擬 google.script.run，頁面內原本的 server() 寫法不需修改。
  3. 修改 config.js 或 gas-shim.js 後，請把 ?v= 後面的數字加 1，避免讀到舊檔。
-->
<script src="./config.js?v=1"></script>
<script src="../shared/gas-shim.js?v=1"></script>
<title>暨大管理學院｜今日教室使用狀況</title>
  <style>
    :root{
      --card-font-step:2px;
      --bg:#eef4fb;
      --panel:rgba(255,255,255,.90);
      --panel-solid:#ffffff;
      --line:#d9e4f0;
      --ink:#10264a;
      --text:#25364d;
      --muted:#6c7f98;
      --blue:#1769d2;
      --green:#3aa85d;
      --green-soft:#e8f6ed;
      --amber:#e8a135;
      --amber-soft:#fff3df;
      --shadow:0 7px 20px rgba(39,72,113,.09);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      font-family:"Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Segoe UI",Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 84% 0%,rgba(157,208,255,.31),transparent 27%),
        radial-gradient(circle at 10% 9%,rgba(206,230,255,.56),transparent 25%),
        linear-gradient(135deg,#f5f9fe 0%,#edf4fb 52%,#f7fbff 100%);
    }
    button,input,select{font:inherit}
    .shell{
      width:100vw;height:100vh;
      padding:20px 26px 14px;
      display:grid;
      grid-template-rows:92px 82px minmax(0,1fr) 52px;
      gap:12px;
    }
    .header{
      min-width:0;
      display:grid;
      grid-template-columns:minmax(430px,1.2fr) auto auto;
      align-items:center;
      gap:24px;
      padding:0 10px;
    }
    .brand{display:flex;align-items:center;gap:18px;min-width:0}
    .brand-mark{
      width:68px;height:68px;flex:0 0 68px;border-radius:18px;
      display:flex;align-items:center;justify-content:center;
      color:#fff;background:linear-gradient(145deg,#75b7ef,#397dc5);
      box-shadow:0 8px 20px rgba(46,111,182,.20);
    }
    .brand-mark svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .brand-copy{min-width:0}
    .school{font-size:16px;font-weight:750;color:#45658b;letter-spacing:.5px;margin-bottom:2px}
    .headline{font-size:34px;line-height:1.05;font-weight:900;color:var(--ink);letter-spacing:1.4px;white-space:nowrap}
    .subhead{margin-top:5px;font-size:11px;letter-spacing:4px;color:#7590ad;font-weight:700}
    .date-box{padding:4px 26px;border-left:1px solid #c9d8e8;border-right:1px solid #c9d8e8;text-align:center;white-space:nowrap}
    .date-main{font-size:23px;font-weight:800;color:var(--ink)}
    .date-sub{margin-top:5px;font-size:11px;color:#71869f;letter-spacing:2px}
    .clock-box{text-align:right;min-width:230px}
    .clock{font-variant-numeric:tabular-nums;font-size:42px;line-height:1;font-weight:900;color:var(--ink);letter-spacing:2px}
    .sync{margin-top:7px;display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:12px;color:#5b728d}
    .sync-dot{width:10px;height:10px;border-radius:50%;background:#3cbb69;box-shadow:0 0 0 4px rgba(60,187,105,.10)}
    .sync-dot.loading{background:#e8a135;box-shadow:0 0 0 4px rgba(232,161,53,.12)}
    .sync-dot.error{background:#dc5c5c;box-shadow:0 0 0 4px rgba(220,92,92,.12)}

    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
    .stat{
      min-width:0;background:var(--panel);border:1px solid rgba(210,225,240,.85);border-radius:17px;
      display:flex;align-items:center;padding:12px 18px;gap:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)
    }
    .stat-icon{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:#eef5ff;color:#276ebd}
    .stat-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .stat:nth-child(2) .stat-icon{background:#e8f6ed;color:#3aa85d}
    .stat:nth-child(3) .stat-icon{background:#fff0ea;color:#df6a45}
    .stat:nth-child(4) .stat-icon{background:#edf4ff;color:#4b83d1}
    .stat:nth-child(5) .stat-icon{background:#f1edff;color:#8065c5}
    .stat-value{font-size:27px;font-weight:900;color:var(--ink);line-height:1}
    .stat-unit{font-size:14px;font-weight:800;margin-left:3px;color:#45617f}
    .stat-label{font-size:11px;color:#72859d;margin-top:5px;font-weight:650;white-space:nowrap}

    .rooms{
      min-height:0;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      grid-template-rows:repeat(4,minmax(0,1fr));
      gap:11px;
    }
    .room-card{
      min-width:0;min-height:0;position:relative;overflow:hidden;
      background:rgba(255,255,255,.94);border:1px solid rgba(210,225,240,.95);border-radius:16px;
      padding:12px 14px 10px;box-shadow:0 5px 15px rgba(43,73,110,.07);
      display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:7px;
    }
    .room-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,#8ebba0)}
    .room-card.soon{background:linear-gradient(135deg,#fffdfa,#fff8ed)}
    .room-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:3px}
    .room-name{font-size:calc(20px + var(--card-font-step));line-height:1;font-weight:900;color:#0f2b52;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .capacity{display:flex;align-items:center;gap:4px;color:#607a98;font-size:calc(11px + var(--card-font-step));font-weight:700;white-space:nowrap}
    .capacity svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .status-row{
      min-height:29px;border-radius:9px;padding:5px 10px;display:flex;align-items:center;gap:8px;
      background:var(--status-bg,#e8f6ed);color:var(--status-fg,#248244);font-size:calc(13px + var(--card-font-step));font-weight:900;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .status-dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:var(--accent,#3aa85d);box-shadow:0 0 0 3px rgba(255,255,255,.52)}
    .card-body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.75fr);grid-template-rows:minmax(0,1fr);gap:10px;align-items:stretch}
    .card-body.single{grid-template-columns:1fr}
    .current,.next{min-width:0;min-height:0;max-height:100%;align-self:center;overflow:hidden}
    .eyebrow{font-size:calc(9px + var(--card-font-step));color:#7a8ea7;font-weight:800;letter-spacing:.7px;margin-bottom:2px}
    .course-title{font-size:calc(13px + var(--card-font-step));line-height:1.28;font-weight:850;color:#1b3557;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:33px}
    .course-meta{margin-top:3px;font-size:calc(10px + var(--card-font-step));line-height:1.25;color:#6b819b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .next{
      padding:7px 9px;border-radius:10px;background:#f5f8fc;border:1px solid #e6edf5;
      display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:4px 6px;align-content:center;
    }
    .next-time{font-size:calc(11px + var(--card-font-step));font-weight:900;color:#365d8b}
    .next .eyebrow{margin:0;align-self:center;white-space:nowrap}
    .next .next-time{min-width:0;text-align:right;white-space:nowrap;line-height:1.15}
    .next .next-title{grid-column:1 / -1;min-height:0;margin:0}
    .next-title{margin-top:2px;font-size:calc(10px + var(--card-font-step));font-weight:750;color:#536b86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .free-message{font-size:calc(13px + var(--card-font-step));font-weight:800;color:#47745a;line-height:1.35}
    .free-until{margin-top:4px;color:#72879c;font-size:calc(10px + var(--card-font-step))}
    .empty-today{color:#8292a5;font-size:calc(11px + var(--card-font-step));font-weight:700}

    .footer{display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#7a8da4;font-size:9px;letter-spacing:.2px}
    .footer strong{color:#607994}
    .page-indicator{font-size:12px;font-weight:800;color:#45617f;white-space:nowrap}
    .rooms-empty{grid-column:1 / -1;grid-row:1 / -1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;font-weight:750}
    .loading-cover{
      position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#f4f9ff,#eaf2fb);
      display:flex;align-items:center;justify-content:center;transition:opacity .3s ease,visibility .3s ease;
    }
    .loading-cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loading-card{text-align:center;color:#526d8c;font-weight:750}
    .spinner{width:34px;height:34px;border-radius:50%;border:4px solid #dbe8f7;border-top-color:#2775c8;margin:0 auto 12px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:1500px), (max-height:820px){
      .shell{padding:12px 16px 9px;grid-template-rows:72px 66px minmax(0,1fr) 52px;gap:8px}
      .brand-mark{width:52px;height:52px;flex-basis:52px;border-radius:14px}.brand-mark svg{width:32px;height:32px}
      .school{font-size:12px}.headline{font-size:27px}.subhead{font-size:9px}.date-main{font-size:18px}.clock{font-size:33px}
      .stat{padding:8px 12px}.stat-icon{width:38px;height:38px;flex-basis:38px;border-radius:12px}.stat-value{font-size:22px}
      .room-card{padding:9px 11px 7px}.room-name{font-size:calc(16px + var(--card-font-step))}.status-row{min-height:24px;font-size:calc(11px + var(--card-font-step));padding:4px 8px}.course-title{font-size:calc(11px + var(--card-font-step));min-height:28px}.course-meta,.next-title{font-size:calc(9px + var(--card-font-step))}.eyebrow{font-size:calc(8px + var(--card-font-step))}
    }

    [hidden]{display:none!important}
    .room-card[role="button"]{cursor:pointer;touch-action:manipulation}
    .room-card[role="button"]:hover{border-color:#83abd5}
    .room-card[role="button"]:active{background:#edf5ff}
    .room-card:focus-visible,.touch-btn:focus-visible{outline:3px solid #1769d2;outline-offset:-3px}
    .page-controls{display:flex;align-items:center;gap:16px}
    .touch-btn{min-height:48px;min-width:100px;padding:8px 18px;border:1px solid #bfd2e7;border-radius:12px;background:#fff;color:#244f7e;font-size:16px;font-weight:800;cursor:pointer;touch-action:manipulation}
    .touch-btn:disabled{opacity:.45;cursor:default}
    .touch-hint{font-size:14px;color:#506b88}
    .page-indicator{font-size:14px;text-align:center;white-space:normal}
    .course-title{min-height:0}
    .next-title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;overflow-wrap:anywhere}
    .detail-dialog{width:min(860px,92vw);max-height:88vh;padding:0;border:1px solid var(--line);border-radius:22px;color:var(--text);background:#fff;box-shadow:0 24px 80px #10264a44;overflow:hidden}
    .detail-dialog::backdrop{background:rgba(16,38,74,.48);backdrop-filter:blur(3px)}
    .detail-layout{display:flex;flex-direction:column;max-height:86vh}
    .detail-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 28px;border-bottom:1px solid var(--line)}
    .detail-head h2{font-size:30px;margin:0;color:var(--ink);overflow-wrap:anywhere}
    .detail-sub{font-size:16px;color:#526b87;margin-top:6px}
    .detail-list{overflow-y:auto;overscroll-behavior:contain;padding:20px 28px;min-height:0;touch-action:pan-y}
    .detail-course{padding:18px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:#f7faff}
    .detail-course.active{border-color:#eca1a1;background:#fff4f4}
    .detail-time{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:800;color:#254c7a}
    .detail-badge{font-size:14px;padding:4px 10px;border-radius:8px;background:#eaf0f7;color:#526b87}
    .active .detail-badge{background:#fde0e0;color:#b4232a}
    .detail-title{font-size:24px;font-weight:800;line-height:1.4;margin:10px 0 6px;overflow-wrap:anywhere}
    .detail-meta{font-size:18px;color:#526b87;line-height:1.5;overflow-wrap:anywhere}
    .detail-foot{padding:14px 28px;font-size:14px;color:#526b87;border-top:1px solid var(--line)}
    @media(max-width:1500px){.footer>span:last-child{display:none}.page-controls{gap:8px}.touch-hint{font-size:12px}.page-indicator{font-size:12px}}
    @media(max-height:960px){
      .shell{padding:12px 16px 9px;grid-template-rows:72px 66px minmax(0,1fr) 52px;gap:8px}
      .room-card{padding:7px 11px 6px;gap:4px}
      .course-title{-webkit-line-clamp:1}
      .current>.eyebrow{display:none}
      .next{padding:4px 7px;gap:2px 6px}
      .next-title{-webkit-line-clamp:1}
    }
    @media(max-height:820px){.next{padding:2px 7px}}
  
/* =====================================================================
   Carbon 主題層（Display.html：1920×1080 教室狀態看板）
   ---------------------------------------------------------------------
   放置位置：Display.html 的 style 結束標籤之前。
   設計依據：Carbon g10 淺色主題。看板需要遠距離辨識，因此：
     ‧ 狀態色用 Carbon 支援色（綠 #24a148、紅 #da1e28、黃 #f1c21b）
     ‧ 卡片直角、無陰影、無外框，靠 1px 間隙與底色區分
     ‧ 狀態列改為 Carbon Tag 的實心色塊，提高對比
   卡片的狀態顏色由 JS 寫在 style 的 --accent / --status-bg / --status-fg，
   這裡用 [style*=色碼] 選擇器把原色換成 Carbon 色，不必改 JS。
   要換回原本外觀：刪除這整段即可。
   ===================================================================== */
:root{
  --cds-font:"IBM Plex Sans","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Segoe UI",Arial,sans-serif;
  --cds-background:#f4f4f4; --cds-layer:#ffffff; --cds-layer-2:#f4f4f4; --cds-layer-hover:#e8e8e8;
  --cds-border-subtle:#e0e0e0; --cds-text:#161616; --cds-text-2:#525252; --cds-text-3:#6f6f6f;
  --cds-interactive:#1e3a8a; --cds-focus:#1e3a8a; /* 主色：V2.5.6 深藍 */
  --cds-success:#24a148; --cds-success-bg:#defbe6; --cds-success-text:#0e6027;
  --cds-warning:#f1c21b; --cds-warning-bg:#fcf4d6; --cds-warning-text:#8e6a00;
  --cds-error:#da1e28;   --cds-error-bg:#fff1f1;   --cds-error-text:#a2191f;
  /* 舊變數改指向 Carbon */
  --bg:var(--cds-background); --panel:var(--cds-layer); --panel-solid:var(--cds-layer); --line:var(--cds-border-subtle);
  --ink:var(--cds-text); --text:var(--cds-text); --muted:var(--cds-text-2); --blue:var(--cds-interactive);
  --green:var(--cds-success); --green-soft:var(--cds-success-bg); --amber:var(--cds-warning); --amber-soft:var(--cds-warning-bg);
  --shadow:none;
}
/* ---------- 全域 ---------- */
html:not(#cds) body{font-family:var(--cds-font);background:var(--cds-background);color:var(--cds-text)}
html:not(#cds) body *{border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important}
html:not(#cds) body :is(.sync-dot,.status-dot,.spinner){border-radius:50%!important}
html:not(#cds) body :is(.clock,.stat-value,.next-time,.course-meta,.date-main,.detail-time){font-variant-numeric:tabular-nums}

/* ---------- 頂部：品牌、日期、時鐘 ---------- */
html:not(#cds) body .shell{padding:0 24px 12px;gap:1px;grid-template-rows:96px 80px minmax(0,1fr) 56px}
html:not(#cds) body .header{background:#1e3a8a;margin:0 -24px;padding:0 32px;color:#ffffff;border-bottom:1px solid #172b66 /* 頂欄深藍，同 V2.5.6 */}
html:not(#cds) body .brand-mark{background:#172b66} /* 深藍滑過色，與頂欄區隔 */
html:not(#cds) body .school{color:#dbe4fb;font-weight:400;letter-spacing:.32px}
html:not(#cds) body .headline{color:#ffffff;font-weight:300;letter-spacing:0}
html:not(#cds) body .subhead{color:#b4c3ec;font-weight:400;font-family:"IBM Plex Mono",Consolas,monospace}
html:not(#cds) body .date-box{border-color:#4c63a4}
html:not(#cds) body .date-main{color:#f8fafc;font-weight:400}
html:not(#cds) body .date-sub{color:#b4c3ec}
html:not(#cds) body .clock{color:#ffffff;font-weight:300;font-family:"IBM Plex Mono",Consolas,monospace}
html:not(#cds) body .sync{color:#dbe4fb}
html:not(#cds) body .sync-dot{background:var(--cds-success)}
html:not(#cds) body .sync-dot.loading{background:var(--cds-warning)}
html:not(#cds) body .sync-dot.error{background:var(--cds-error)}

/* ---------- 統計列：Carbon Tile，以 1px 間隙分隔 ---------- */
html:not(#cds) body .stats{gap:1px;margin-top:12px;background:var(--cds-border-subtle)}
html:not(#cds) body .stat{background:var(--cds-layer);border:0;padding:12px 20px}
html:not(#cds) body .stat-icon,html:not(#cds) body .stat:nth-child(n) .stat-icon{background:var(--cds-layer-2);color:var(--cds-text)}
html:not(#cds) body .stat:nth-child(2) .stat-icon{color:var(--cds-success)}
html:not(#cds) body .stat:nth-child(3) .stat-icon{color:var(--cds-error)}
html:not(#cds) body .stat:nth-child(4) .stat-icon{color:#b28600}
html:not(#cds) body .stat-value{font-weight:300;font-size:32px;color:var(--cds-text)}
html:not(#cds) body .stat-unit{font-weight:400;color:var(--cds-text-2)}
html:not(#cds) body .stat-label{color:var(--cds-text-2);font-weight:400;font-size:12px;letter-spacing:.32px}

/* ---------- 教室卡片 ---------- */
html:not(#cds) body .rooms{gap:1px;background:var(--cds-border-subtle);margin-top:12px}
html:not(#cds) body .room-card{background:var(--cds-layer);border:0;padding:12px 16px 10px 19px}
html:not(#cds) body .room-card::before{width:4px}
html:not(#cds) body .room-card.soon{background:var(--cds-layer)}
html:not(#cds) body .room-card[role="button"]:hover{background:var(--cds-layer-hover);border:0}
html:not(#cds) body .room-card[role="button"]:active{background:#e0e0e0}
html:not(#cds) body .room-card:focus-visible{outline:2px solid var(--cds-focus)!important;outline-offset:-2px}
html:not(#cds) body .room-name{color:var(--cds-text);font-weight:600}
html:not(#cds) body .capacity{color:var(--cds-text-2);font-weight:400}
/* 狀態列：實心色塊，白字（遠距離最清楚） */
html:not(#cds) body .status-row{background:var(--accent);color:#fff;font-weight:600;min-height:32px;padding:4px 10px}
html:not(#cds) body .status-dot{background:#fff;box-shadow:none}
/* 把 JS 給的原色換成 Carbon 支援色 */
html:not(#cds) body .room-card[style*="#E55353"]{--accent:var(--cds-error)!important}
html:not(#cds) body .room-card[style*="#E8A135"]{--accent:var(--cds-warning)!important}
html:not(#cds) body .room-card[style*="#E8A135"] .status-row{color:#161616}
html:not(#cds) body .room-card[style*="#E8A135"] .status-dot{background:#161616}
html:not(#cds) body .room-card[style*="#3AA85D"]{--accent:var(--cds-success)!important}
html:not(#cds) body .eyebrow{color:var(--cds-text-3);font-weight:400;letter-spacing:.32px}
html:not(#cds) body .course-title{color:var(--cds-text);font-weight:600}
html:not(#cds) body .course-meta{color:var(--cds-text-2)}
html:not(#cds) body .next{background:var(--cds-layer-2);border:0;border-left:2px solid var(--cds-border-subtle)}
html:not(#cds) body .next-time{color:var(--cds-text);font-weight:600}
html:not(#cds) body .next-title{color:var(--cds-text-2);font-weight:400}
html:not(#cds) body .free-message{color:var(--cds-success-text);font-weight:600}

html:not(#cds) body .detail-sub,html:not(#cds) body .detail-meta,html:not(#cds) body .detail-foot{color:var(--cds-text-2)}

html:not(#cds) body .detail-time{color:var(--cds-text);font-weight:600}
html:not(#cds) body .detail-badge{background:var(--cds-layer);color:var(--cds-text);border:1px solid var(--cds-border-subtle)}

html:not(#cds) body .detail-title{font-weight:600}
/* ===================== Carbon 主題層結束 ===================== */

</style>

</head>
<body>

  <main class="shell">

        </div>
        <div class="brand-copy">
          <div class="school">國立暨南國際大學　管理學院</div>

          <div class="subhead">CLASSROOM STATUS BOARD</div>

    <section class="stats">
      <div class="stat"><div class="stat-icon"><svg class="lucide lucide-building" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M12 6h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 6h.01"/><path d="M9 22v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><rect x="4" y="2" width="16" height="20" rx="2"/></svg></div><div><div><span class="stat-value" id="statRooms">0</span><span class="stat-unit">間</span></div><div class="stat-label">教室總數</div></div></div>
      <div class="stat"><div class="stat-icon"><svg class="lucide lucide-circle-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg></div><div><div><span class="stat-value" id="statFree">0</span><span class="stat-unit">間</span></div><div class="stat-label">目前空堂</div></div></div>
      <div class="stat"><div class="stat-icon"><svg class="lucide lucide-users" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></div><div><div><span class="stat-value" id="statBusy">0</span><span class="stat-unit">間</span></div><div class="stat-label">使用中</div></div></div>
      <div class="stat"><div class="stat-icon"><svg class="lucide lucide-clock" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div><div><div><span class="stat-value" id="statSoon">0</span><span class="stat-unit">間</span></div><div class="stat-label">30 分鐘內即將開始</div></div></div>
      <div class="stat"><div class="stat-icon"><svg class="lucide lucide-file-text" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></div><div><div><span class="stat-value" id="statCourses">0</span><span class="stat-unit">筆</span></div><div class="stat-label">今日課程／借用</div></div></div>
    </section>

    <section class="rooms" id="roomsGrid" aria-label="教室狀態卡片，每頁四欄四列"></section>

    <footer class="footer"><span class="touch-hint" id="touchHint">點選教室卡片，查看今日完整課表</span><nav class="page-controls" aria-label="教室分頁"><button class="touch-btn" id="prevPage" type="button">‹ 上一頁</button><span class="page-indicator" id="pageIndicator"></span><button class="touch-btn" id="nextPage" type="button">下一頁 ›</button></nav><span id="footerSync">最後更新 —</span></footer>
  </main>

  <dialog class="detail-dialog" id="roomDetail" aria-labelledby="detailTitle" aria-describedby="detailSub">
    <div class="detail-layout">
      <div class="detail-head"><div><h2 id="detailTitle"></h2><div class="detail-sub" id="detailSub"></div></div><button class="touch-btn" id="closeDetail" type="button" autofocus><svg class="lucide lucide-x" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg> 關閉</button></div>
      <div class="detail-list" id="detailList"></div>
      <div class="detail-foot">查看課表時暫停輪播 · 閒置 60 秒後自動返回看板</div>
    </div>
  </dialog>
<script>
const TZ='Asia/Taipei';
const PAGE_SIZE=16;
let PAGE_INTERVAL_MS=15000;
let touchEnabled=true;
let detailRoomName=null;
let lastTouchAt=0;
let touchPauseUntil=0;
let pointerHeld=false;
let renderedGridHtml='';
const TOUCH_PAUSE_MS=30000;
const DETAIL_IDLE_MS=60000;
let pageIndex=0;
let nextPageAt=0;
let rooms=[];
let courses=[];
let lastVersion='';
let currentDate='';
let lastSyncAt=null;
let polling=false;
let refreshTimer=null;
let clockTimer=null;

function server(fn,args=[]){
  return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function pad(n){return String(n).padStart(2,'0')}
function taipeiParts(){
  const parts=new Intl.DateTimeFormat('zh-TW',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const o={};parts.forEach(p=>o[p.type]=p.value);
  return o;
}
function todayKey(){
  const p=taipeiParts();return `${p.year}-${p.month}-${p.day}`;
}
function nowMinutes(){
  const p=taipeiParts();return Number(p.hour)*60+Number(p.minute)+Number(p.second)/60;
}
function timeToMin(v){
  const m=String(v||'').match(/^(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null;
}
function hexToRgba(hex,a){
  let s=String(hex||'#9FD0A8').replace('#','');if(s.length===3)s=s.split('').map(x=>x+x).join('');
  const n=parseInt(s,16);if(!Number.isFinite(n))return `rgba(159,208,168,${a})`;
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function sortCourses(list){return [...(list||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));}
function roomCourses(name){return sortCourses(courses.filter(c=>c.classroom===name));}
function stateForRoom(room,now){
  const list=roomCourses(room.name);
  const current=list.filter(c=>{
    const s=timeToMin(c.startTime),e=timeToMin(c.endTime);return s!==null&&e!==null&&s<=now&&now<e;
  });
  const next=list.find(c=>{const s=timeToMin(c.startTime);return s!==null&&s>now;})||null;
  if(current.length){return {kind:'busy',current:current[0],next};}
  if(next){
    const diff=timeToMin(next.startTime)-now;
    if(diff>=0&&diff<=30)return {kind:'soon',current:null,next,diff};
    return {kind:'free',current:null,next,diff};
  }
  return {kind:'free',current:null,next:null,diff:null};
}
function statusStyle(state){
  if(state.kind==='busy'){
    const c=state.current||{};
    // Display 看板：使用中統一以紅色強調，讓遠距離也能快速辨識。
    return {accent:'#E55353',bg:'#FDECEC',fg:'#B4232A',label:`使用中・${c.useType||'課程'}`};
  }
  if(state.kind==='soon')return {accent:'#E8A135',bg:'#FFF0D7',fg:'#9A5C08',label:`即將開始・${Math.max(1,Math.ceil(state.diff))} 分鐘`};
  return {accent:'#3AA85D',bg:'#E6F5EB',fg:'#277844',label:'空堂'};
}
function cardHtml(room,state){
  const st=statusStyle(state);
  let body='';
  if(state.kind==='busy'){
    const c=state.current;
    const next=state.next?`<div class="next"><div class="eyebrow">下一堂</div><div class="next-time">${esc(state.next.startTime)}</div><div class="next-title">${esc(state.next.title||'未命名')}</div></div>`:'';
    body=`<div class="card-body ${next?'':'single'}"><div class="current"><div class="eyebrow">目前</div><div class="course-title">${esc(c.title||'未命名課程')}</div><div class="course-meta">${esc(c.startTime)}–${esc(c.endTime)}　${esc(c.department||'')} ${c.person?'・'+esc(c.person):''}</div></div>${next}</div>`;
  }else if(state.next){
    const mins=Math.max(0,Math.round(state.diff));
    const hr=Math.floor(mins/60),mm=mins%60;
    const duration=hr>0?`${hr} 小時${mm?` ${mm} 分`:''}`:`${mm} 分鐘`;
    body=`<div class="card-body"><div class="current"><div class="free-message">${state.kind==='soon'?'請留意下一堂即將開始':'目前可使用'}</div><div class="free-until">空堂至 ${esc(state.next.startTime)}${state.kind==='free'?`（約 ${duration}）`:''}</div></div><div class="next"><div class="eyebrow">下一堂</div><div class="next-time">${esc(state.next.startTime)}</div><div class="next-title">${esc(state.next.title||'未命名')}・${esc(state.next.department||'')}</div></div></div>`;
  }else{
    body=`<div class="card-body single"><div class="current"><div class="free-message">目前可使用</div><div class="empty-today">今日後續無其他課程／借用</div></div></div>`;
  }
  return `<article data-room="${esc(room.name)}" ${touchEnabled?'role="button" tabindex="0" aria-haspopup="dialog" aria-label="'+esc(room.name)+'，查看今日課表"':''} class="room-card ${state.kind==='soon'?'soon':''}" style="--accent:${st.accent};--status-bg:${st.bg};--status-fg:${st.fg}"><div class="room-head"><div class="room-name">${esc(room.name)}</div><div class="capacity"><svg class="lucide lucide-users" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>${esc(room.capacity||'—')}人</div></div><div class="status-row"><i class="status-dot"></i>${esc(st.label)}</div>${body}</article>`;
}
function render(){
  const now=nowMinutes();
  const states=rooms.map(r=>({room:r,state:stateForRoom(r,now)}));
  const busy=states.filter(x=>x.state.kind==='busy').length;
  const soon=states.filter(x=>x.state.kind==='soon').length;
  const free=states.length-busy-soon;
  document.getElementById('statRooms').textContent=rooms.length;
  document.getElementById('statBusy').textContent=busy;
  document.getElementById('statSoon').textContent=soon;
  document.getElementById('statFree').textContent=free;
  document.getElementById('statCourses').textContent=courses.length;
  const grid=document.getElementById('roomsGrid');
  const pageCount=Math.max(1,Math.ceil(states.length/PAGE_SIZE));
  const timestamp=Date.now();
  if(pageIndex>=pageCount){pageIndex=0;nextPageAt=0;}
  if(pageCount>1){
    if(!nextPageAt)nextPageAt=timestamp+PAGE_INTERVAL_MS;
    if(timestamp>=nextPageAt&&!detailRoomName&&timestamp>=touchPauseUntil&&!pointerHeld){
      pageIndex=(pageIndex+1)%pageCount;
      nextPageAt=timestamp+PAGE_INTERVAL_MS;
    }
  }else{
    pageIndex=0;nextPageAt=0;
  }
  const start=pageIndex*PAGE_SIZE;
  const visibleStates=states.slice(start,start+PAGE_SIZE);
  const gridHtml=visibleStates.length
    ?visibleStates.map(x=>cardHtml(x.room,x.state)).join('')
    :'<div class="rooms-empty">目前沒有設定顯示教室</div>';
  if(!pointerHeld&&renderedGridHtml!==gridHtml){
    const focused=grid.contains(document.activeElement)?document.activeElement.dataset.room:null;
    grid.innerHTML=gridHtml;
    renderedGridHtml=gridHtml;
    if(focused){const card=[...grid.children].find(x=>x.dataset.room===focused);if(card)card.focus({preventScroll:true});}
  }
  document.getElementById('prevPage').hidden=!touchEnabled||pageCount<=1;
  document.getElementById('nextPage').hidden=!touchEnabled||pageCount<=1;
  document.getElementById('touchHint').textContent=touchEnabled?'點選教室卡片，查看今日完整課表':'College of Management, NCNU';
  document.getElementById('pageIndicator').textContent=states.length
    ?`第 ${pageIndex+1}／${pageCount} 頁 · 教室 ${start+1}–${start+visibleStates.length}／${states.length}${pageCount>1?(timestamp<touchPauseUntil?' · 暫停輪播':` · 每 ${PAGE_INTERVAL_MS/1000} 秒輪播`):''}`
    :'0 間教室';
  renderDetail();
}
function updateClock(){
  const p=taipeiParts();
  const date=`${p.year}年 ${Number(p.month)}月${Number(p.day)}日（${String(p.weekday).replace('週','')}）`;
  document.getElementById('dateMain').textContent=date;
  document.getElementById('clock').textContent=`${p.hour}:${p.minute}`;
  const nowDate=`${p.year}-${p.month}-${p.day}`;
  if(currentDate&&nowDate!==currentDate){
    loadToday(true);
  }
  if(detailRoomName&&Date.now()-lastTouchAt>=DETAIL_IDLE_MS)closeRoomDetail();
  render();
}
function setSync(state,text){
  const dot=document.getElementById('syncDot');
  dot.className='sync-dot'+(state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('syncText').textContent=text;
}
function syncStamp(){
  const p=taipeiParts();return `${p.hour}:${p.minute}:${p.second}`;
}
async function loadToday(force=false){
  if(polling)return;
  polling=true;
  setSync('loading','更新中…');
  try{
    const date=todayKey();
    const data=await server('getDisplayData',[date]);
    if(currentDate!==(data?.date||date)&&detailRoomName)closeRoomDetail();
    currentDate=data?.date||date;
    applyDisplayPreferences(data?.displaySettings?.preferences);
    const nextRooms=Array.isArray(data?.rooms)?data.rooms:[];
    if(JSON.stringify(rooms.map(r=>r.name))!==JSON.stringify(nextRooms.map(r=>r.name))){
      pageIndex=0;nextPageAt=0;
    }
    rooms=nextRooms;
    courses=Array.isArray(data?.courses)?data.courses:[];
    lastVersion=String(data?.version||'');
    lastSyncAt=syncStamp();
    setSync('ok',`已同步 ${lastSyncAt}`);
    document.getElementById('footerSync').textContent=`最後更新 ${lastSyncAt}`;
    render();
    document.getElementById('loadingCover').classList.add('hidden');
  }catch(e){
    console.error(e);setSync('error','同步失敗，稍後重試');
  }finally{polling=false;}
}
async function checkVersion(){
  if(polling||document.hidden)return;
  polling=true;
  try{
    const version=String(await server('getDisplayVersion')||'');
    if(version&&lastVersion&&version!==lastVersion){
      polling=false;
      await loadToday(true);
      return;
    }
    if(!lastVersion)lastVersion=version;
  }catch(e){console.warn('版本檢查失敗',e);}
  finally{polling=false;}
}

function applyDisplayPreferences(p={}){
  const step={standard:0,large:2,extraLarge:4}[p.fontSize??'large']??2;
  document.documentElement.style.setProperty('--card-font-step',step+'px');
  const seconds=[10,15,30,60].includes(Number(p.rotationSeconds))?Number(p.rotationSeconds):15;
  if(PAGE_INTERVAL_MS!==seconds*1000)nextPageAt=Date.now()+seconds*1000;
  PAGE_INTERVAL_MS=seconds*1000;
  touchEnabled=p.touchEnabled!==false;
  if(!touchEnabled&&detailRoomName)closeRoomDetail();
}
function changePage(delta){
  if(!touchEnabled)return;
  const count=Math.max(1,Math.ceil(rooms.length/PAGE_SIZE));
  pageIndex=(pageIndex+delta+count)%count;
  touchPauseUntil=Date.now()+TOUCH_PAUSE_MS;
  nextPageAt=touchPauseUntil;
  render();
}
function openRoomDetail(name){
  if(!touchEnabled||!rooms.some(r=>r.name===name))return;
  detailRoomName=name;lastTouchAt=Date.now();
  renderDetail();
  const dialog=document.getElementById('roomDetail');
  if(!dialog.open)dialog.showModal();
  document.getElementById('detailList').scrollTop=0;
}
function closeRoomDetail(){
  const name=detailRoomName;
  detailRoomName=null;
  const dialog=document.getElementById('roomDetail');
  if(dialog.open)dialog.close();
  touchPauseUntil=Date.now()+TOUCH_PAUSE_MS;nextPageAt=touchPauseUntil;
  const card=[...document.getElementById('roomsGrid').children].find(c=>c.dataset.room===name);
  if(card&&touchEnabled)card.focus({preventScroll:true});
}
function renderDetail(){
  if(!detailRoomName)return;
  const room=rooms.find(r=>r.name===detailRoomName);
  if(!room){closeRoomDetail();return;}
  document.getElementById('detailTitle').textContent=room.name+'｜今日課表';
  document.getElementById('detailSub').textContent=currentDate+' · 容量 '+(room.capacity||'—')+' 人';
  const now=nowMinutes();
  const list=roomCourses(room.name);
  const html=list.length?list.map(c=>{
    const start=timeToMin(c.startTime),end=timeToMin(c.endTime);
    const active=start!==null&&end!==null&&start<=now&&now<end;
    const label=active?'使用中':end!==null&&end<=now?'已結束':'尚未開始';
    return '<article class="detail-course'+(active?' active':'')+'"><div class="detail-time">'+esc(c.startTime)+'–'+esc(c.endTime)+'<span class="detail-badge">'+label+'</span></div><div class="detail-title">'+esc(c.title||'未命名課程')+'</div><div class="detail-meta">'+[c.department,c.person,c.useType].filter(Boolean).map(esc).join(' · ')+'</div></article>';
  }).join(''):'<p class="detail-title">今日無課程／借用</p>';
  const el=document.getElementById('detailList');
  if(el.innerHTML!==html)el.innerHTML=html;
}
function bindTouchControls(){
  const grid=document.getElementById('roomsGrid');
  grid.addEventListener('click',e=>{const c=e.target.closest('[data-room]');if(c)openRoomDetail(c.dataset.room);});
  grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-room][role="button"]')){e.preventDefault();openRoomDetail(e.target.dataset.room);}});
  grid.addEventListener('pointerdown',()=>{pointerHeld=true;});
  grid.addEventListener('focusin',()=>{touchPauseUntil=Date.now()+TOUCH_PAUSE_MS;nextPageAt=touchPauseUntil;});
  window.addEventListener('pointerup',()=>{pointerHeld=false;});
  window.addEventListener('pointercancel',()=>{pointerHeld=false;});
  window.addEventListener('blur',()=>{pointerHeld=false;});
  document.getElementById('prevPage').addEventListener('click',()=>changePage(-1));
  document.getElementById('nextPage').addEventListener('click',()=>changePage(1));
  document.getElementById('closeDetail').addEventListener('click',closeRoomDetail);
  const dialog=document.getElementById('roomDetail');
  dialog.addEventListener('cancel',e=>{e.preventDefault();closeRoomDetail();});
  ['pointerdown','pointermove','keydown','wheel','scroll'].forEach(type=>dialog.addEventListener(type,()=>{lastTouchAt=Date.now();},{capture:true,passive:true}));
}
window.addEventListener('load',async()=>{
  bindTouchControls();
  currentDate=todayKey();
  updateClock();
  await loadToday(true);
  clockTimer=setInterval(updateClock,1000);
  refreshTimer=setInterval(checkVersion,5000);
});
</script>
</body>
</html>
