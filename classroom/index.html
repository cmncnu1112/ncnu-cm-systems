ition:fixed;z-index:1700;top:58px;left:340px;width:min(570px,60vw);max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none}.search-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.search-item:hover{background:#f6f9fe}.search-item strong{display:block}.search-item small{color:var(--muted)}
    @media(max-width:1280px){.brand{min-width:220px}.top-links span:not(.sync-pill){display:none}.layout{grid-template-columns:225px 1fr}.control-bar .title-group h1{font-size:18px}.control-bar select{min-width:125px}}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.brand{min-width:auto}.brand small{display:none}.top-search{max-width:none}.side-stats{grid-template-columns:1fr 1fr}.type-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.control-bar{flex-wrap:wrap;overflow:visible}.control-spacer{display:none}}
  
    /* 固定 Day 模式欄寬：不因篩選後教室數量變少而自動撐滿 */
    #dayView .schedule{width:max-content!important;min-width:0!important;}
    #dayView .schedule thead th:first-child,#dayView .schedule tbody th{width:92px!important;min-width:92px!important;max-width:92px!important;}
    #dayView .schedule thead th:not(:first-child),#dayView .schedule td{width:150px!important;min-width:150px!important;max-width:150px!important;}

    /* 課程類別色標選擇器 */
    .course-color-field{grid-column:1/-1;}
    .course-color-presets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:2px;}
    .course-color-option{height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 9px;display:flex;align-items:center;justify-content:center;gap:7px;color:#445168;font-size:12px;font-weight:700;transition:.15s;position:relative;}
    .course-color-option:hover{background:#f8fafc;border-color:#b8c7da;}
    .course-color-option.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(23,105,210,.12);background:#f7fbff;color:#24548f;}
    .course-color-option .color-swatch{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.06);flex:0 0 auto;}
    .course-color-option.custom{overflow:hidden;}
    .course-color-option.custom input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;}
    .custom-color-preview{width:15px;height:15px;border-radius:50%;background:#9fd0a8;border:1px solid rgba(0,0,0,.08);flex:0 0 auto;}
    @media(max-width:700px){.course-color-presets{grid-template-columns:repeat(2,1fr)}.course-color-option:last-child{grid-column:1/-1}}


    /* 修正：課程卡需要跨越多個時段時，不可被起始儲存格裁切 */
    #dayView .schedule td{overflow:visible!important;}
    #dayView .schedule tbody{overflow:visible;}
    #dayView .schedule tr{overflow:visible;}
    #dayView .course-card{z-index:12;}


    .search-modal-box{width:min(620px,94vw)}
    .search-modal-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .search-modal-row input{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 13px;outline:none;font-size:14px}
    .search-modal-row input:focus{border-color:#8fbaf1;box-shadow:0 0 0 3px #edf5ff}
    .search-modal-row button{height:42px}
    .search-modal-results{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff;min-height:74px}
    .search-modal-empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}


    /* ===== 即時時間軸 ===== */
    #dayView{position:relative;}
    .current-time-line{
      position:absolute;
      left:92px;
      right:0;
      height:2px;
      background:#1769d2;
      z-index:18;
      pointer-events:none;
      display:none;
      box-shadow:0 0 0 1px rgba(255,255,255,.35);
    }
    .current-time-line::before{
      content:"";
      position:absolute;
      left:-4px;
      top:50%;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#1769d2;
      transform:translateY(-50%);
    }
    .current-time-label{
      position:absolute;
      left:4px;
      top:50%;
      transform:translateY(-50%);
      padding:2px 6px;
      border-radius:6px;
      background:#1769d2;
      color:#fff;
      font-size:10px;
      line-height:1.2;
      font-weight:800;
      white-space:nowrap;
      box-shadow:0 1px 4px rgba(23,105,210,.25);
    }


    /* 半小時時間軸 */
    #dayView .schedule tbody th{font-variant-numeric:tabular-nums;}
    #dayView .halfhour-label{font-size:10px!important;margin-left:0!important;color:#43506a;font-weight:700;}
    #dayView .schedule tbody tr:nth-child(even) td{background:#fcfdff;}
    #dayView .schedule tbody tr:nth-child(even) th{background:#f8fafc;}


    /* 匯入新學期課表 */
    .import-drop{border:1.5px dashed #b7c6da;border-radius:12px;padding:18px;text-align:center;background:#f9fbfe;transition:.18s}
    .import-drop:hover{border-color:#7eabe5;background:#f3f8ff}
    .import-drop input[type=file]{display:none}
    .import-file-btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:9px;border:1px solid #cfe0f5;background:#fff;color:#1769d2;font-weight:750;cursor:pointer}
    .import-file-name{margin-top:8px;font-size:12px;color:#5d6879;word-break:break-all}
    .import-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .import-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    .import-kpi{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcfe}
    .import-kpi small{display:block;color:var(--muted);font-size:10px}
    .import-kpi strong{display:block;font-size:16px;margin-top:2px}
    .import-warnings{margin-top:10px;padding:10px;border-radius:10px;background:#fff8e8;border:1px solid #f2deb4;font-size:12px;line-height:1.6;max-height:145px;overflow:auto}
    .import-preview-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
    .import-preview-table th,.import-preview-table td{border-bottom:1px solid var(--line);padding:6px;text-align:left;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
    .import-preview-table th{background:#f6f9fd;position:sticky;top:0}
    .import-preview-wrap{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
    .import-note{font-size:11px;color:#657187;line-height:1.6;margin-top:8px}


    /* 課程卡文字依卡片高度自適應 */
    .course-card.card-compact{padding:4px 7px;}
    .course-card.card-compact .course-title{font-size:11px;line-height:1.18;-webkit-line-clamp:1;}
    .course-card.card-compact .course-meta{display:none;}

    .course-card.card-medium .course-title{font-size:12px;line-height:1.25;-webkit-line-clamp:2;}
    .course-card.card-medium .course-meta{font-size:10px;line-height:1.2;}

    .course-card.card-tall .course-title{font-size:12px;line-height:1.28;-webkit-line-clamp:4;}
    .course-card.card-tall .course-meta{font-size:10px;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;}

    .course-card.card-x-tall .course-title{font-size:12px;line-height:1.3;-webkit-line-clamp:6;}
    .course-card.card-x-tall .course-meta{font-size:10px;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;}



    /* ===== 水平捲動時固定時間欄 + 完整現在時間線 ===== */
    #dayView{position:relative; isolation:isolate;}
    #dayView .schedule thead th:first-child{
      position:sticky!important;
      left:0!important;
      z-index:80!important;
      background:#fff!important;
      box-shadow:2px 0 0 var(--line), 5px 0 8px rgba(23,32,51,.05);
    }
    #dayView .schedule tbody th{
      position:sticky!important;
      left:0!important;
      z-index:70!important;
      background:#fbfcfe!important;
      overflow:hidden!important;
      box-shadow:2px 0 0 var(--line), 5px 0 8px rgba(23,32,51,.04);
    }
    #dayView .schedule tbody tr:nth-child(even) th{
      background:#f8fafc!important;
    }
    #dayView .course-card{z-index:12!important;}
    #dayView .current-time-line{
      z-index:40!important;
      right:auto!important;
      pointer-events:none;
    }



    /* ===== 課程卡標題：恢復單行省略 ===== */
    .course-title{
      display:block!important;
      white-space:nowrap!important;
      overflow:hidden!important;
      text-overflow:ellipsis!important;
      -webkit-line-clamp:unset!important;
      -webkit-box-orient:unset!important;
      line-height:1.25!important;
      max-height:none!important;
    }
    .course-card.card-medium .course-title,
    .course-card.card-tall .course-title,
    .course-card.card-x-tall .course-title{
      -webkit-line-clamp:unset!important;
      max-height:none!important;
    }


    /* 時間軸最晚顯示至 22:00 */


    /* 常用操作：固定文字為兩行，避免窄欄位出現不規則換行 */
    .quick-label{
      line-height:1.3;
      min-height:29px;
      white-space:nowrap;
      text-align:center;
    }


    /* ===== 底部水平捲軸美化 ===== */
    #dayView{scrollbar-width:thin;scrollbar-color:#94a3b8 #eef2f7;}
    #dayView::-webkit-scrollbar{height:8px;}
    #dayView::-webkit-scrollbar-track{background:#eef2f7;border-radius:999px;}
    #dayView::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:999px;border:2px solid #eef2f7;}
    #dayView::-webkit-scrollbar-thumb:hover{background:#64748b;}


    /* 月檢視：課程點依課程色標顯示 */
    .month-course-dot{
      display:inline-block;
      width:9px;
      height:9px;
      margin:0 2px;
      border-radius:50%;
      vertical-align:middle;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 1px 2px rgba(0,0,0,.08);
    }


    /* 週／月檢視：完整細項提示 */
    .course-detail-tooltip{
      position:fixed;z-index:2600;display:none;min-width:220px;max-width:320px;
      padding:10px 12px;border:1px solid #dbe4ef;border-radius:10px;
      background:rgba(255,255,255,.98);color:#172033;
      box-shadow:0 10px 30px rgba(31,45,68,.18);
      font-size:12px;line-height:1.55;pointer-events:none;
    }
    .course-detail-tooltip .tip-title{font-size:13px;font-weight:800;margin-bottom:5px}
    .course-detail-tooltip .tip-row{display:flex;gap:6px;margin:2px 0;align-items:flex-start}
    .course-detail-tooltip .tip-label{flex:0 0 62px;color:#748096;font-weight:650}
    .course-detail-tooltip .tip-value{flex:1;min-width:0;word-break:break-word}
    .mini-course,.month-course-dot{cursor:default}


    /* ===== 月檢視：色點固定單行、整齊排列 ===== */
    .month-dot-row{
      min-height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:3px;
      flex-wrap:nowrap;
      white-space:nowrap;
      overflow:hidden;
    }
    .month-dot-row .month-course-dot{
      width:8px;
      height:8px;
      margin:0;
      flex:0 0 8px;
      border:1px solid rgba(0,0,0,.07);
      box-shadow:none;
    }
    .month-more{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:16px;
      min-width:20px;
      padding:0 3px;
      border-radius:999px;
      background:#eef3f8;
      color:#5b687c;
      font-size:9px;
      line-height:1;
      font-weight:750;
      flex:0 0 auto;
      cursor:default;
    }
    #rangeView .range-table td{
      vertical-align:middle;
    }


    /* ===== 月檢視：固定格尺寸，以 6 個色點為基準 ===== */
    #rangeView .range-table{
      width:max-content;
      table-layout:fixed;
      border-collapse:separate;
      border-spacing:0;
    }
    #rangeView .range-table th,
    #rangeView .range-table td{
      height:44px;
      min-height:44px;
      max-height:44px;
      padding:0 4px;
      overflow:hidden;
    }
    #rangeView .range-table th:first-child,
    #rangeView .range-table td:first-child{
      width:82px;
      min-width:82px;
      max-width:82px;
    }
    #rangeView .range-table th:not(:first-child),
    #rangeView .range-table td:not(:first-child){
      width:72px;
      min-width:72px;
      max-width:72px;
    }
    .month-dot-row{
      width:100%;
      height:100%;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:3px;
      flex-wrap:nowrap;
      white-space:nowrap;
      overflow:hidden;
    }
    .month-dot-row .month-course-dot{
      width:8px;
      height:8px;
      flex:0 0 8px;
      margin:0;
    }


    /* ===== 月檢視：滿版 + 教室列高響應瀏覽器高度 ===== */
    #rangeView{
      min-height:0;
      overflow:auto;
    }
    #rangeView .view-placeholder{
      height:100%;
      padding:0;
    }
    #rangeView .range-table{
      width:max-content;
      min-width:100%;
      height:100%;
      table-layout:fixed;
      border-collapse:separate;
      border-spacing:0;
    }
    #rangeView .range-table thead{
      height:38px;
    }
    #rangeView .range-table thead th{
      height:38px;
      min-height:38px;
      max-height:38px;
      padding:0 4px;
      vertical-align:middle;
    }
    #rangeView .range-table tbody tr{
      height:var(--range-room-row-h,44px);
    }
    #rangeView .range-table tbody th,
    #rangeView .range-table tbody td{
      height:var(--range-room-row-h,44px);
      min-height:var(--range-room-row-h,44px);
      max-height:var(--range-room-row-h,44px);
      padding:0 4px;
      vertical-align:middle;
      overflow:hidden;
    }
    #rangeView .range-table th:first-child,
    #rangeView .range-table td:first-child{
      width:82px;
      min-width:82px;
      max-width:82px;
    }
    #rangeView .range-table th:not(:first-child),
    #rangeView .range-table td:not(:first-child){
      width:72px;
      min-width:72px;
      max-width:72px;
    }


    /* ===== 週檢視：教室列高與月檢視一致 ===== */
    #rangeView .range-table tbody tr{
      height:var(--range-room-row-h,44px);
    }
    #rangeView .range-table tbody th,
    #rangeView .range-table tbody td{
      height:var(--range-room-row-h,44px);
      min-height:var(--range-room-row-h,44px);
      max-height:var(--range-room-row-h,44px);
    }


    /* ===== 週檢視：教室欄寬與月檢視一致 ===== */
    #rangeView .range-table.week-range-table{
      width:100%;
      min-width:100%;
      table-layout:fixed;
    }
    #rangeView .range-table.week-range-table col.room-col{
      width:82px;
    }
    #rangeView .range-table.week-range-table th:first-child,
    #rangeView .range-table.week-range-table td:first-child{
      width:82px!important;
      min-width:82px!important;
      max-width:82px!important;
    }


    /* ===== 週檢視：真正固定教室欄 82px ===== */
    #rangeView .week-range-table{
      width:100%!important;
      min-width:100%!important;
      table-layout:fixed!important;
    }
    #rangeView .week-range-table col.room-col{
      width:82px!important;
      min-width:82px!important;
      max-width:82px!important;
    }
    #rangeView .week-range-table col.day-col{
      width:calc((100% - 82px) / 7)!important;
    }
    #rangeView .week-range-table th:first-child,
    #rangeView .week-range-table td:first-child{
      width:82px!important;
      min-width:82px!important;
      max-width:82px!important;
      box-sizing:border-box!important;
    }


    /* ===== 週檢視：改用 Grid，第一欄真正固定 82px ===== */
    .week-grid{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:82px repeat(7,minmax(0,1fr));
      grid-template-rows:38px repeat(var(--week-room-count,1),var(--range-room-row-h,44px));
      border-top:1px solid var(--line);
      border-left:1px solid var(--line);
      background:#fff;
    }
    .week-grid-cell{
      min-width:0;
      min-height:0;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-sizing:border-box;
      font-size:12px;
      background:#fff;
    }
    .week-grid-head{
      background:#f9fbfd;
      font-weight:700;
      line-height:1.2;
      text-align:center;
    }
    .week-grid-room{
      background:#f9fbfd;
      font-weight:700;
      white-space:nowrap;
    }
    .week-grid-day{
      padding:3px 5px;
      display:block;
      position:relative;
    }
    .week-grid-day .mini-course{
      width:100%;
      box-sizing:border-box;
    }


    /* 反灰的前後月份日期也可點選 */
    .cal-day.muted{cursor:pointer;}
    .cal-day.muted:hover{background:var(--blue-soft);color:var(--blue);}


    /* ===== 淺色／深色模式 ===== */
    .theme-switch{display:flex;height:34px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);flex:0 0 auto}
    .theme-switch button{border:0;background:transparent;color:var(--muted);padding:0 10px;font-size:12px;font-weight:700;white-space:nowrap}
    .theme-switch button+button{border-left:1px solid var(--line)}
    .theme-switch button.active{background:var(--blue-soft);color:var(--blue)}

    html[data-theme="dark"]{
      --blue:#65a8ff;--blue2:#86baff;--blue-soft:#162f50;--ink:#e8edf5;--muted:#9ba8ba;
      --line:#334154;--bg:#111823;--card:#182231;--green:#58c98d;--orange:#f3b65f;--red:#ef7e8b;
      --purple:#a990ed;--cyan:#68b9ca;--shadow:0 8px 24px rgba(0,0,0,.25);
    }
    html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] .side-panel,
    html[data-theme="dark"] .modal,
    html[data-theme="dark"] .context,
    html[data-theme="dark"] .search-results,
    html[data-theme="dark"] .search-modal-results{background:var(--card);border-color:var(--line);color:var(--ink)}
    html[data-theme="dark"] .btn,
    html[data-theme="dark"] .segmented,
    html[data-theme="dark"] .segmented button,
    html[data-theme="dark"] .theme-switch,
    html[data-theme="dark"] .control-bar input[type=date],
    html[data-theme="dark"] .control-bar select,
    html[data-theme="dark"] .select-full,
    html[data-theme="dark"] .ghost-btn,
    html[data-theme="dark"] .field input,
    html[data-theme="dark"] .field select,
    html[data-theme="dark"] .field textarea,
    html[data-theme="dark"] .type-card,
    html[data-theme="dark"] .context button,
    html[data-theme="dark"] .course-color-option,
    html[data-theme="dark"] .search-modal-row input{background:#202c3c;color:var(--ink);border-color:var(--line)}
    html[data-theme="dark"] .btn:hover,
    html[data-theme="dark"] .context button:hover,
    html[data-theme="dark"] .type-card:hover,
    html[data-theme="dark"] .course-color-option:hover{background:#263548}
    html[data-theme="dark"] .btn-primary,
    html[data-theme="dark"] .segmented button.active{background:#297ad8;color:#fff;border-color:#297ad8}
    html[data-theme="dark"] .theme-switch button.active{background:#28415f;color:#9fc8ff}
    html[data-theme="dark"] .side-stat{background:#202b39;border-color:var(--line)}
    html[data-theme="dark"] .side-stat-icon{filter:saturate(.85) brightness(.9)}
    html[data-theme="dark"] .schedule thead th,
    html[data-theme="dark"] .schedule td{background:#182231;color:var(--ink);border-color:var(--line)}
    html[data-theme="dark"] .schedule tbody th{background:#1d2938;color:#c5d0df;border-color:var(--line)}
    html[data-theme="dark"] #dayView .schedule tbody tr:nth-child(even) td{background:#1b2635}
    html[data-theme="dark"] #dayView .schedule tbody tr:nth-child(even) th{background:#202c3b}
    html[data-theme="dark"] .schedule td:hover{background:#22344b}
    html[data-theme="dark"] .slot-code{color:#dbe5f2}
    html[data-theme="dark"] .halfhour-label{color:#b6c4d6!important}
    html[data-theme="dark"] .range-table th,
    html[data-theme="dark"] .range-table td{border-color:var(--line);color:var(--ink)}
    html[data-theme="dark"] .range-table th{background:#1d2938}
    html[data-theme="dark"] .range-table td{background:#182231}
    html[data-theme="dark"] .week-grid,
    html[data-theme="dark"] .week-grid-cell{background:#182231;color:var(--ink);border-color:var(--line)}
    html[data-theme="dark"] .week-grid-head,
    html[data-theme="dark"] .week-grid-room{background:#1d2938}
    html[data-theme="dark"] .cal-nav button{color:#b9c6d7}
    html[data-theme="dark"] .cal-week{color:#95a4b8}
    html[data-theme="dark"] .cal-day.muted{color:#66758a}
    html[data-theme="dark"] .cal-day:hover{background:#263a53}
    html[data-theme="dark"] .quick-btn{background:#223044;color:#aebdd0}
    html[data-theme="dark"] .quick-btn:hover{background:#2a405a;color:#8fc0ff}
    html[data-theme="dark"] .quick-btn.primary{background:#297ad8;color:#fff}
    html[data-theme="dark"] .course-detail-tooltip{background:rgba(25,35,49,.98);color:var(--ink);border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
    html[data-theme="dark"] .course-detail-tooltip .tip-title{color:var(--ink)}
    html[data-theme="dark"] .course-detail-tooltip .tip-label{color:#93a4ba}
    html[data-theme="dark"] .import-drop{background:#1d2938;border-color:#43546b}
    html[data-theme="dark"] .import-drop:hover{background:#22344b;border-color:#5b83b4}
    html[data-theme="dark"] .sync-pill{background:#18345a;color:#9fc8ff;border-color:#315c8f}
    html[data-theme="dark"] .toast{background:#e7edf6;color:#182231}
    html[data-theme="dark"] ::-webkit-scrollbar-track{background:#141d29}
    html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#4d5f75}
    html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:#63758c}


    /* ===== 深色模式完整修正：日檢視時間/教室、週課程文字、週月捲軸 ===== */

    /* 所有可水平/垂直捲動課表統一捲軸尺寸 */
    #dayView,
    #rangeView,
    #rangeContent{
      scrollbar-width:thin;
      scrollbar-color:#8b98a9 #eef2f6;
    }
    #dayView::-webkit-scrollbar,
    #rangeView::-webkit-scrollbar,
    #rangeContent::-webkit-scrollbar{
      width:8px;
      height:8px;
    }
    #dayView::-webkit-scrollbar-track,
    #rangeView::-webkit-scrollbar-track,
    #rangeContent::-webkit-scrollbar-track{
      background:#eef2f6;
      border-radius:999px;
    }
    #dayView::-webkit-scrollbar-thumb,
    #rangeView::-webkit-scrollbar-thumb,
    #rangeContent::-webkit-scrollbar-thumb{
      background:#8b98a9;
      border-radius:999px;
      border:1px solid #eef2f6;
    }
    #dayView::-webkit-scrollbar-thumb:hover,
    #rangeView::-webkit-scrollbar-thumb:hover,
    #rangeContent::-webkit-scrollbar-thumb:hover{
      background:#6f7d90;
    }

    /* 深色：日檢視整個表頭及固定時間欄，不留白底 */
    html[data-theme="dark"] #dayView .schedule thead th,
    html[data-theme="dark"] #dayView .schedule thead th:first-child,
    html[data-theme="dark"] #dayView .schedule tbody th,
    html[data-theme="dark"] #dayView .schedule tbody th:first-child{
      background:#182536 !important;
      color:#e8eef7 !important;
      border-color:#33465c !important;
    }
    html[data-theme="dark"] #dayView .schedule tbody th .slot-code,
    html[data-theme="dark"] #dayView .schedule tbody th small,
    html[data-theme="dark"] #dayView .schedule thead th small{
      color:#9fb2c9 !important;
    }
    html[data-theme="dark"] #dayView .schedule td{
      background:#182536 !important;
      border-color:#33465c !important;
    }

    /* sticky 左欄一定蓋在課程卡上方且保持深色 */
    html[data-theme="dark"] #dayView .schedule thead th:first-child{
      box-shadow:3px 0 6px rgba(0,0,0,.26);
    }
    html[data-theme="dark"] #dayView .schedule tbody th{
      box-shadow:3px 0 6px rgba(0,0,0,.18);
    }

    /* 深色：週/月 Grid 或 Table 的背景與格線 */
    html[data-theme="dark"] .week-grid-cell,
    html[data-theme="dark"] #rangeView .range-table td{
      background:#182536 !important;
      border-color:#33465c !important;
    }
    html[data-theme="dark"] .week-grid-head,
    html[data-theme="dark"] .week-grid-room,
    html[data-theme="dark"] #rangeView .range-table th{
      background:#152131 !important;
      color:#e8eef7 !important;
      border-color:#33465c !important;
    }

    /* 深色捲軸：與日檢視同款，只調整明暗 */
    html[data-theme="dark"] #dayView,
    html[data-theme="dark"] #rangeView,
    html[data-theme="dark"] #rangeContent{
      scrollbar-color:#66788d #111b29;
    }
    html[data-theme="dark"] #dayView::-webkit-scrollbar-track,
    html[data-theme="dark"] #rangeView::-webkit-scrollbar-track,
    html[data-theme="dark"] #rangeContent::-webkit-scrollbar-track{
      background:#111b29;
    }
    html[data-theme="dark"] #dayView::-webkit-scrollbar-thumb,
    html[data-theme="dark"] #rangeView::-webkit-scrollbar-thumb,
    html[data-theme="dark"] #rangeContent::-webkit-scrollbar-thumb{
      background:#66788d;
      border-color:#111b29;
    }
    html[data-theme="dark"] #dayView::-webkit-scrollbar-thumb:hover,
    html[data-theme="dark"] #rangeView::-webkit-scrollbar-thumb:hover,
    html[data-theme="dark"] #rangeContent::-webkit-scrollbar-thumb:hover{
      background:#8395aa;
    }


    /* 週課程卡文字依色塊亮度決定，不因深色主題強制變白 */
    html[data-theme="dark"] .mini-course{
      text-shadow:none !important;
    }


    /* 月檢視：色點改為靠左排列 */
    .month-dot-row{
      justify-content:flex-start !important;
      padding-left:5px;
      box-sizing:border-box;
    }


    /* 浮動細項提示：教師/借用人等標籤固定單行 */
    .course-detail-tooltip .tip-label{
      flex:0 0 78px !important;
      width:78px !important;
      white-space:nowrap !important;
      word-break:keep-all !important;
    }


    @media(max-width:1280px){
      .control-bar .title-group h1{
        font-size:17px !important;
      }
    }


    /* 淺色模式：時間/教室固定欄右側取消粗分隔線，與深色模式一致 */
    html:not([data-theme="dark"]) #dayView .schedule thead th:first-child,
    html:not([data-theme="dark"]) #dayView .schedule tbody th{
      box-shadow:none !important;
      border-right:1px solid var(--line) !important;
    }


    /* ===== 教室篩選：多選勾選 Modal ===== */
    .room-filter-btn{
      min-width:132px;
      gap:6px;
      white-space:nowrap;
    }
    .room-filter-btn #roomFilterCount{
      font-size:11px;
      color:var(--muted);
      font-weight:700;
    }
    .room-filter-modal{
      width:min(560px,calc(100vw - 28px));
      max-height:min(760px,calc(100vh - 36px));
      display:flex;
      flex-direction:column;
    }
    .room-filter-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    .room-filter-head h2{margin:0;}
    .room-filter-toolbar{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
    }
    .room-filter-modal-count{
      margin-left:auto;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }
    .room-filter-list{
      flex:1;
      min-height:180px;
      max-height:460px;
      overflow:auto;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
      padding:3px 2px 8px;
    }
    .room-check-item{
      display:flex;
      align-items:center;
      gap:9px;
      min-height:42px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--panel);
      cursor:pointer;
      user-select:none;
      box-sizing:border-box;
    }
    .room-check-item:hover{
      border-color:var(--blue);
      background:var(--blue-soft);
    }
    .room-check-item input{
      width:16px;
      height:16px;
      margin:0;
      accent-color:var(--blue);
      flex:0 0 auto;
    }
    .room-check-name{
      font-weight:700;
      line-height:1.2;
      min-width:0;
    }
    .room-check-capacity{
      margin-left:auto;
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
    }
    html[data-theme="dark"] .room-check-item{
      background:#1c2b3d;
      border-color:#34475d;
    }
    html[data-theme="dark"] .room-check-item:hover{
      background:#24384f;
      border-color:#6ca9f0;
    }
    @media(max-width:620px){
      .room-filter-list{grid-template-columns:1fr;}
    }


    /* 淺色模式：固定時間/教室欄保留柔和陰影，但不使用粗分隔線 */
    html:not([data-theme="dark"]) #dayView .schedule thead th:first-child,
    html:not([data-theme="dark"]) #dayView .schedule tbody th{
      border-right:1px solid var(--line) !important;
      box-shadow:3px 0 6px rgba(31,45,68,.10) !important;
    }

    html:not([data-theme="dark"]) #dayView .schedule thead th:first-child{
      box-shadow:4px 0 8px rgba(31,45,68,.12) !important;
    }


    /* 淺色模式：左上「時間/教室」表頭只保留右側陰影，不要下方陰影 */
    html:not([data-theme="dark"]) #dayView .schedule thead th:first-child{
      box-shadow:4px 0 8px -4px rgba(31,45,68,.14) !important;
    }


    /* ===== Index 桌面純閱覽版 ===== */
    .readonly-pill{
      display:inline-flex;align-items:center;justify-content:center;
      height:30px;padding:0 10px;border-radius:999px;
      background:#eef5ff;color:#2769b6;border:1px solid #d7e7fb;

    .mobile-view-row select{

/* =====================================================================
   Carbon 主題層（index.html / admin.html / mobile.html 共用）
   ---------------------------------------------------------------------
   放置位置：每個檔案「最後一個 style 結束標籤之前」，讓它在層疊順序上最後生效。
   設計依據：IBM Carbon Design System v11
     ‧ 淺色 = g10 主題（底 #f4f4f4、圖層 #ffffff）
     ‧ 深色 = g100 主題（底 #161616、圖層 #262626）
   覆寫手法：
     ‧ 所有選擇器以 html:not(#cds):not(#cds-x) 開頭。每個 :not(#id) 會讓權重多一個 ID 等級，
       兩個就能穩定蓋過原本的 class 規則，以及 html[data-theme="dark"] #dayView … 這類含 ID 的規則。
       （#cds、#cds-x 是頁面上不存在的 ID，只用來提高權重，不會選到任何元素）
     ‧ 原檔有少數 !important，因此本層對顏色、邊框類屬性也加 !important。
     ‧ 刻意「不」覆寫由 JS 寫在 style 屬性上的值（課程卡底色、色點顏色），
       保留使用者自訂的課程類別色標。
   要換回原本外觀：直接刪除這整段即可，不影響任何功能。
   ===================================================================== */

/* ---------- 1. 設計代幣（Design Tokens） ---------- */
:root{
  /* 字體：英數優先 IBM Plex Sans，中文使用微軟正黑體 */
  --cds-font:"IBM Plex Sans","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Segoe UI",Arial,sans-serif;
  --cds-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  /* g10 淺色主題 */
  --cds-background:#f4f4f4;        /* 頁面底色 */
  --cds-layer:#ffffff;             /* 第一層（面板、表格） */
  --cds-layer-2:#f4f4f4;           /* 第二層（面板內的區塊） */
  --cds-layer-hover:#e8e8e8;       /* 滑過 */
  --cds-layer-selected:#e0e0e0;    /* 選取 */
  --cds-field:#ffffff;             /* 輸入框底色（在灰底上） */
  --cds-field-2:#f4f4f4;           /* 輸入框底色（在白色面板上） */
  --cds-border-subtle:#e0e0e0;     /* 細分隔線 */
  --cds-border-strong:#e0e0e0;     /* 輸入框底線：與分隔線同色，全站線條統一 */
  --cds-text:#161616;              /* 主要文字 */
  --cds-text-2:#525252;            /* 次要文字 */
  --cds-text-3:#6f6f6f;            /* 說明文字（V2.5.6 --helper） */
  --cds-placeholder:#a8a8a8;       /* 輸入框提示文字（V2.5.6 --placeholder） */
  --cds-text-disabled:#c6c6c6;
  /* 主色：與「鑰匙、設備與庫存管理後台」V2.5.6 相同的深藍 */
  --cds-interactive:#1e3a8a;       /* 主要按鈕、選取、勾選框（V2.5.6 --navy） */
  --cds-interactive-hover:#172b66; /* 滑過（--navy-dark） */
  --cds-interactive-active:#0f1d45;/* 按下（--navy-press） */
  --cds-link:#1e3a8a;
  --cds-focus:#1e3a8a;             /* 焦點外框 */
  --cds-highlight:#e8eefc;         /* 選取的淡藍底（--navy-soft） */
  --cds-amber:#d97706;             /* 琥珀橘：數字徽章、提示色條（--amber） */
  --cds-btn-secondary:#ffffff;     /* 次要按鈕改白底，不用深灰 */
  --cds-btn-secondary-hover:#e8e8e8;
  --cds-inverse:#ffffff;           /* 提示框、通知底色（改淺色，不用深灰） */
  --cds-inverse-text:#161616;
  --cds-success:#24a148;  --cds-success-bg:#defbe6;  --cds-success-text:#0e6027;
  --cds-warning:#f1c21b;  --cds-warning-bg:#fcf4d6;  --cds-warning-text:#8e6a00;
  --cds-error:#da1e28;    --cds-error-bg:#fff1f1;    --cds-error-text:#a2191f;
  --cds-info-bg:#e8eefc;  --cds-info-text:#1e3a8a;
  --cds-overlay:rgba(22,22,22,.5);
}
/* g100 深色主題：只換代幣，元件規則共用 */
html[data-theme="dark"]{
  --cds-background:#161616;
  --cds-layer:#262626;
  --cds-layer-2:#393939;
  --cds-layer-hover:#333333;
  --cds-layer-selected:#525252;
  --cds-field:#262626;
  --cds-field-2:#393939;
  --cds-border-subtle:#393939;
  --cds-border-strong:#393939;
  --cds-text:#f4f4f4;
  --cds-text-2:#c6c6c6;
  --cds-text-3:#a8a8a8;
  --cds-text-disabled:#525252;
  --cds-link:#a9bdf2;
  --cds-focus:#ffffff;
  --cds-highlight:#172b66;
  --cds-btn-secondary:#262626;
  --cds-btn-secondary-hover:#333333;
  --cds-inverse:#262626;
  --cds-inverse-text:#f4f4f4;
  --cds-success-bg:#044317;  --cds-success-text:#a7f0ba;
  --cds-warning-bg:#483700;  --cds-warning-text:#fddc69;
  --cds-error-bg:#520408;    --cds-error-text:#ffb3b8;
  --cds-info-bg:#172b66;     --cds-info-text:#c7d5f7;
  --cds-overlay:rgba(0,0,0,.65);
}
/* 讓原檔仍在使用的舊變數也指向 Carbon 代幣，未個別覆寫的地方自動跟著變 */
html:not(#cds):not(#cds-x){
  --blue:var(--cds-interactive);--blue2:var(--cds-interactive-hover);--blue-soft:var(--cds-highlight);
  --ink:var(--cds-text);--muted:var(--cds-text-2);--line:var(--cds-border-subtle);
  --bg:var(--cds-background);--card:var(--cds-layer);
  --green:var(--cds-success);--red:var(--cds-error);--orange:#ff832b;
  --shadow:none;--radius:0;
}

/* ---------- 2. 全域：直角、無陰影、字體 ---------- */
html:not(#cds):not(#cds-x) body{font-family:var(--cds-font)!important;background:var(--cds-background)!important;color:var(--cds-text)!important;letter-spacing:.16px}
html:not(#cds):not(#cds-x) body *{border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important}
/* 例外：只有色點、色票、載入圈維持圓形；標籤、徽章、狀態膠囊一律直角 */
html:not(#cds):not(#cds-x) body :is(.dot,.month-course-dot,.color-swatch,.custom-color-preview,.schedule-spinner,.spinner,.mobile-month-dots *,.legend-item i){border-radius:999px!important}
html:not(#cds):not(#cds-x) body :is(input,select,textarea,button){font-family:var(--cds-font)!important}
/* 焦點：Carbon 用 2px 內框，鍵盤操作才顯示 */
html:not(#cds):not(#cds-x) body :is(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--cds-focus)!important;outline-offset:-2px!important}
/* 數字使用等寬數字，時間、統計值對齊 */
html:not(#cds):not(#cds-x) body :is(.slot-code,.slot-time,.halfhour-label,.side-stat strong,.stat-value,.cal-day){font-variant-numeric:tabular-nums}

/* ---------- 3. 版面與面板（Carbon Tile：白底、無外框） ---------- */
html:not(#cds):not(#cds-x) body .layout{gap:1px!important;padding:0!important;background:var(--cds-background)!important}
html:not(#cds):not(#cds-x) body .sidebar{background:var(--cds-layer)!important;border-right:1px solid var(--cds-border-subtle)!important;padding:0!important}
html:not(#cds):not(#cds-x) body .main{padding:8px 16px 16px!important;gap:8px!important}
html:not(#cds):not(#cds-x) body .panel{background:var(--cds-layer)!important;border:0!important}
html:not(#cds):not(#cds-x) body .side-panel{margin:0!important;padding:16px!important;border-bottom:1px solid var(--cds-border-subtle)!important}
/* 面板標題：Carbon 的 heading-compact-01，黑字不用藍字 */
html:not(#cds):not(#cds-x) body .panel-title,html:not(#cds):not(#cds-x) body .tip-title{color:var(--cds-text)!important;font-size:14px!important;font-weight:600!important;letter-spacing:.16px}
html:not(#cds):not(#cds-x) body .tips,html:not(#cds):not(#cds-x) body .side-legend,html:not(#cds):not(#cds-x) body .quick-item{color:var(--cds-text-2)!important}

/* ---------- 4. 頂部列（Carbon UI Shell Header：#161616、高 48px） ---------- */
html:not(#cds):not(#cds-x) body .topbar{background:#161616!important;color:#f4f4f4!important;border-bottom:1px solid #393939!important}
html:not(#cds):not(#cds-x) body .topbar{height:48px!important;padding:0 16px!important}
html:not(#cds):not(#cds-x) body .top-search input{background:#262626!important;color:#f4f4f4!important;border:0!important;border-bottom:1px solid #6f6f6f!important;height:32px!important}
html:not(#cds):not(#cds-x) body .top-search button{background:var(--cds-interactive)!important;color:#fff!important;height:32px!important}


/* ---------- 5. 按鈕（Carbon Button） ---------- */
/* 一般按鈕 → Tertiary（藍框藍字），高度 32px（sm） */
html:not(#cds):not(#cds-x) body :is(.btn,.ghost-btn,.room-filter-btn,.sidebar-collapse-btn,.nav-date-btn,.mobile-today-btn,.mobile-filter-btn,.mobile-icon-btn,.mobile-theme-btn,.top-icon-btn,.theme-toggle-btn){
  background:transparent!important;color:var(--cds-text)!important;border:1px solid var(--cds-border-subtle)!important;font-weight:400!important;transition:background .11s cubic-bezier(.2,0,.38,.9)}
html:not(#cds):not(#cds-x) body :is(.btn,.ghost-btn,.room-filter-btn,.sidebar-collapse-btn,.nav-date-btn,.mobile-today-btn,.mobile-filter-btn,.mobile-icon-btn,.mobile-theme-btn,.top-icon-btn,.theme-toggle-btn):hover{background:var(--cds-layer-hover)!important}
/* 主要按鈕 → Primary（藍底白字） */
html:not(#cds):not(#cds-x) body :is(.btn-primary,.quick-btn.primary,.btn.primary){background:var(--cds-interactive)!important;color:#fff!important;border-color:var(--cds-interactive)!important}
html:not(#cds):not(#cds-x) body :is(.btn-primary,.quick-btn.primary,.btn.primary):hover{background:var(--cds-interactive-hover)!important}
html:not(#cds):not(#cds-x) body :is(.btn-primary,.quick-btn.primary,.btn.primary):active{background:var(--cds-interactive-active)!important}
/* 危險按鈕 → Danger（紅底白字） */
html:not(#cds):not(#cds-x) body .btn-danger{background:var(--cds-error)!important;color:#fff!important;border-color:var(--cds-error)!important}
html:not(#cds):not(#cds-x) body .btn-danger:hover{background:#b81921!important}
/* 警示按鈕 → 黃色系 */
html:not(#cds):not(#cds-x) body .btn-warning{background:var(--cds-warning-bg)!important;color:var(--cds-warning-text)!important;border-color:var(--cds-warning)!important}
/* 側欄快速功能鈕 → Icon-only Ghost button */
html:not(#cds):not(#cds-x) body .quick-btn{background:transparent!important;color:var(--cds-text-2)!important;transform:none!important}
html:not(#cds):not(#cds-x) body .quick-btn:hover{background:var(--cds-layer-hover)!important;color:var(--cds-text)!important}
html:not(#cds):not(#cds-x) body button:disabled{background:var(--cds-layer-selected)!important;color:var(--cds-text-disabled)!important;border-color:transparent!important;cursor:not-allowed!important;opacity:1!important}

/* ---------- 6. 輸入元件（Carbon Field：只有底線） ---------- */
html:not(#cds):not(#cds-x) body :is(.field input,.field select,.field textarea,.select-full,.control-bar input[type=date],.control-bar select,.search-modal-row input,.vacancy-continuous-controls select,.mobile-view-row select,select,input[type=date],input[type=text],input[type=search],input[type=number],input[type=time],textarea){
  background-color:var(--cds-field)!important;color:var(--cds-text)!important;
  border:0!important;border-bottom:1px solid var(--cds-border-strong)!important}
/* 白色面板內的輸入框改用灰底，維持 Carbon 的層次對比 */
html:not(#cds):not(#cds-x) body :is(.modal,.sidebar,.side-panel) :is(input,select,textarea){background-color:var(--cds-field-2)!important}
html:not(#cds):not(#cds-x) body :is(input,select,textarea):focus{outline:2px solid var(--cds-focus)!important;outline-offset:-2px!important}
html:not(#cds):not(#cds-x) body .field label{color:var(--cds-text-2)!important;font-size:12px!important;font-weight:400!important;letter-spacing:.32px}
html:not(#cds):not(#cds-x) body ::placeholder{color:var(--cds-placeholder,#a8a8a8)!important}

/* ---------- 7. 工具列、分段切換（Content Switcher） ---------- */
html:not(#cds):not(#cds-x) body .control-bar .title-group h1,html:not(#cds):not(#cds-x) body .page-head h1{font-weight:400!important;font-size:20px!important;color:var(--cds-text)!important}
html:not(#cds):not(#cds-x) body .control-divider{background:var(--cds-border-subtle)!important}
html:not(#cds):not(#cds-x) body :is(.segmented,.theme-switch,.vacancy-mode-tabs,.mobile-segmented,.mobile-week-tabs){border:1px solid var(--cds-border-subtle)!important;background:transparent!important;gap:0!important}
html:not(#cds):not(#cds-x) body :is(.segmented,.theme-switch,.vacancy-mode-tabs,.mobile-segmented,.mobile-week-tabs) button{background:transparent!important;color:var(--cds-text-2)!important;border:0!important;border-right:1px solid var(--cds-border-subtle)!important;font-weight:400!important}
html:not(#cds):not(#cds-x) body :is(.segmented,.theme-switch,.vacancy-mode-tabs,.mobile-segmented,.mobile-week-tabs) button:last-child{border-right:0!important}
html:not(#cds):not(#cds-x) body :is(.segmented,.theme-switch,.vacancy-mode-tabs,.mobile-segmented,.mobile-week-tabs) button:hover{background:var(--cds-layer-hover)!important;color:var(--cds-text)!important}
/* 選中：Carbon content switcher 選中為反白（黑底白字） */
html:not(#cds):not(#cds-x) body :is(.segmented,.theme-switch,.vacancy-mode-tabs,.mobile-segmented,.mobile-week-tabs) button.active,
html:not(#cds):not(#cds-x) body .mobile-week-tab.active{background:var(--cds-interactive)!important;color:#fff!important;font-weight:600!important}

/* ---------- 8. 標籤（Carbon Tag：圓角膠囊） ---------- */
html:not(#cds):not(#cds-x) body :is(.today-tag,.sync-pill,.readonly-pill){background:var(--cds-info-bg)!important;color:var(--cds-info-text)!important;border:1px solid var(--cds-border-subtle)!important;font-weight:400!important;font-size:12px!important;height:24px!important;padding:0 8px!important;display:inline-flex;align-items:center;gap:4px}

/* ---------- 9. 小月曆（Carbon DatePicker） ---------- */
html:not(#cds):not(#cds-x) body .cal-head{font-weight:600!important;color:var(--cds-text)!important}
html:not(#cds):not(#cds-x) body .cal-nav button{color:var(--cds-text)!important}
html:not(#cds):not(#cds-x) body .cal-nav button:hover{background:var(--cds-layer-hover)!important}
html:not(#cds):not(#cds-x) body .cal-week{color:var(--cds-text)!important;font-weight:400}
html:not(#cds):not(#cds-x) body .cal-grid{gap:0!important}
html:not(#cds):not(#cds-x) body .cal-day{color:var(--cds-text)!important;padding:9px 0!important}
html:not(#cds):not(#cds-x) body .cal-day:hover{background:var(--cds-layer-hover)!important}
html:not(#cds):not(#cds-x) body .cal-day.muted{color:var(--cds-text-disabled)!important}
html:not(#cds):not(#cds-x) body .cal-day.today{outline:0!important;color:var(--cds-interactive)!important;font-weight:600!important;position:relative}
/* 今天不加小點，只用深藍粗體字標示；選取日為深藍底白字 */
html:not(#cds):not(#cds-x) body .cal-day::after{content:none!important;display:none!important}
html:not(#cds):not(#cds-x) body .cal-day.selected{background:var(--cds-interactive)!important;color:#fff!important;font-weight:400!important}

/* ---------- 10. 側欄統計（Carbon 資料列，無卡片外框） ---------- */
html:not(#cds):not(#cds-x) body .side-stats{gap:1px!important;background:var(--cds-border-subtle)}
html:not(#cds):not(#cds-x) body .side-stat{background:var(--cds-layer)!important;border:0!important;padding:12px!important}
html:not(#cds):not(#cds-x) body .side-stat-icon{background:var(--cds-layer-2)!important}
html:not(#cds):not(#cds-x) body .side-stat small{color:var(--cds-text-2)!important;font-size:12px!important}
html:not(#cds):not(#cds-x) body .side-stat strong{font-size:20px!important;font-weight:400!important;color:var(--cds-text)!important}

/* 各檢視捲動容器 */
html:not(#cds):not(#cds-x) body :is(#dayView,#rangeView,#rangeContent,#vacancyView){background:var(--cds-layer)!important}

/* ---------- 11. 日課表（Carbon DataTable 風格） ---------- */
html:not(#cds):not(#cds-x) body .schedule th,html:not(#cds):not(#cds-x) body .schedule td{border-color:var(--cds-border-subtle)!important}
html:not(#cds):not(#cds-x) body .schedule thead th{background:var(--cds-layer-selected)!important;color:var(--cds-text)!important;font-weight:600!important;font-size:14px!important}
html:not(#cds):not(#cds-x) body .schedule thead th small,html:not(#cds):not(#cds-x) body .schedule thead th span{color:var(--cds-text-2)!important;font-weight:400!important}
html:not(#cds):not(#cds-x) body .schedule tbody th{background:var(--cds-layer-2)!important;color:var(--cds-text-2)!important;font-weight:400!important}
html:not(#cds):not(#cds-x) body .schedule td{background:var(--cds-layer)!important}
html:not(#cds):not(#cds-x) body #dayView .schedule tbody tr:nth-child(even) :is(td,th){background:var(--cds-layer)!important}
html:not(#cds):not(#cds-x) body #dayView .schedule tbody tr:nth-child(even) th{background:var(--cds-layer-2)!important}
html:not(#cds):not(#cds-x) body .schedule td:hover{background:var(--cds-layer-hover)!important}
html:not(#cds):not(#cds-x) body :is(.slot-code){color:var(--cds-text)!important;font-weight:400!important}
html:not(#cds):not(#cds-x) body :is(.slot-time,.halfhour-label){color:var(--cds-text-3)!important}
/* 課程卡：保留使用者色標底色，改成直角＋左側 3px 色條 */
html:not(#cds):not(#cds-x) body .course-card{border:0!important;border-left:3px solid var(--cds-card-bar,#8d8d8d)!important;padding:6px 8px 6px 9px!important}
html:not(#cds):not(#cds-x) body .course-card:hover{filter:brightness(.96)}
html:not(#cds):not(#cds-x) body .course-title{font-weight:600!important}
/* 現在時間線：Carbon 紅色指示 */
html:not(#cds):not(#cds-x) body .current-time-line{background:var(--cds-error)!important}
html:not(#cds):not(#cds-x) body .current-time-line *{background:var(--cds-error)!important;color:#fff!important}
html:not(#cds):not(#cds-x) body .drop-target.drag-over{outline:2px dashed var(--cds-interactive)!important;background:var(--cds-highlight)!important}

/* ---------- 12. 週／月／範圍表 ---------- */
html:not(#cds):not(#cds-x) body :is(.range-table,.week-range-table,.vacancy-week-table,.import-preview-table) :is(th,td){border-color:var(--cds-border-subtle)!important}
html:not(#cds):not(#cds-x) body :is(.range-table,.week-range-table,.vacancy-week-table,.import-preview-table) th{background:var(--cds-layer-selected)!important;color:var(--cds-text)!important;font-weight:600!important}
html:not(#cds):not(#cds-x) body :is(.range-table,.week-range-table,.vacancy-week-table,.import-preview-table) td{background:var(--cds-layer)!important;color:var(--cds-text)!important}
html:not(#cds):not(#cds-x) body :is(.week-grid-head,.week-grid-room){background:var(--cds-layer-selected)!important;color:var(--cds-text)!important;border-color:var(--cds-border-subtle)!important}
html:not(#cds):not(#cds-x) body :is(.week-grid-cell,.week-grid-day){background:var(--cds-layer)!important;border-color:var(--cds-border-subtle)!important}
html:not(#cds):not(#cds-x) body .mini-course{border-left:3px solid var(--cds-card-bar,#8d8d8d)!important}
/* 手機議程卡、月曆卡：左側邊條也跟著 --cds-card-bar（自訂色彩由程式算出同色系深色） */
html:not(#cds):not(#cds-x) body :is(.agenda-card,.mobile-month-card){border-left:3px solid var(--cds-card-bar,#8d8d8d)!important}

/* ---------- 13. 空堂查詢 ---------- */
html:not(#cds):not(#cds-x) body :is(.vacancy-shell,.vacancy-day-card,.vacancy-toolbar){background:var(--cds-layer)!important;border:0!important}
html:not(#cds):not(#cds-x) body .vacancy-day-head{background:var(--cds-layer-selected)!important;color:var(--cds-text)!important;border:0!important}
html:not(#cds):not(#cds-x) body :is(.vacancy-chip,.vacancy-room-chip){background:var(--cds-success-bg)!important;color:var(--cds-success-text)!important;border:0!important}
html:not(#cds):not(#cds-x) body :is(.is-free,.legend-free){background:var(--cds-success-bg)!important;color:var(--cds-success-text)!important;border-color:transparent!important}
html:not(#cds):not(#cds-x) body :is(.is-busy,.legend-busy){background:var(--cds-error-bg)!important;color:var(--cds-error-text)!important;border-color:transparent!important}
html:not(#cds):not(#cds-x) body .vacancy-cell-button{border:0!important}

<script>
/* =====================================================================
   自訂色彩課程卡：左側邊條自動改成「同色系的深色」
   ---------------------------------------------------------------------
   原因：課程卡底色是程式寫在 style 上的，CSS 讀不到這個顏色，
        所以自訂色彩的卡片原本只能用固定的中性灰邊條。
   做法：
     1. 監看頁面，有課程卡出現或重新繪製時，讀取它的底色
     2. 換算成 HSL，保留色相、拉高飽和度、把亮度壓到約一半，得到同色系深色
     3. 寫進卡片的 CSS 變數 --cds-card-bar，Carbon 主題層會拿它當左側邊條顏色
   四個預設色標（管院／院外／活動／會議）已有 Carbon 指定色，這裡會略過。
   適用：日課表 .course-card、週月課表 .mini-course、手機 .agenda-card、.mobile-month-card
   ===================================================================== */
(function () {
  'use strict';

  const CARD_SELECTOR = '.course-card,.mini-course,.agenda-card,.mobile-month-card';
  // 四個預設色標（rgb 格式），交給 CSS 處理，不覆寫
  const PRESETS = ['rgb(159, 208, 168)', 'rgb(141, 189, 242)', 'rgb(240, 193, 127)', 'rgb(197, 171, 231)'];

  /** 'rgb(234, 153, 153)' → [234,153,153]；讀不到回傳 null */
  function parseRgb(s) {
    const m = String(s || '').match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
  }

  /** RGB → HSL（h:0-360、s/l:0-1） */
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }

  /** 由底色算出同色系深色：亮度約一半（介於 22%～42%），飽和度略為提高 */
  function deeperShade(rgb) {
    const hsl = rgbToHsl(rgb[0], rgb[1], rgb[2]);
    const h = Math.round(hsl[0]);
    // 幾乎沒有彩度的灰色維持灰色，其餘提高飽和度讓邊條更鮮明
    const s = hsl[1] < 0.08 ? hsl[1] : Math.min(0.9, hsl[1] * 1.1 + 0.1);
    const l = Math.max(0.22, Math.min(0.42, hsl[2] * 0.5));
    return 'hsl(' + h + ', ' + Math.round(s * 100) + '%, ' + Math.round(l * 100) + '%)';
  }

  /** 處理單張卡片 */
  function applyBar(card) {
    const bg = card.style.backgroundColor; // 讀「寫在 style 上的原始底色」，不受主題層覆寫影響
    if (!bg || PRESETS.indexOf(bg) >= 0) {
      if (card.style.getPropertyValue('--cds-card-bar')) card.style.removeProperty('--cds-card-bar');
      return;
    }
    const rgb = parseRgb(bg);
    if (!rgb) return;
    const bar = deeperShade(rgb);
    if (card.style.getPropertyValue('--cds-card-bar') !== bar) card.style.setProperty('--cds-card-bar', bar);
  }

  // 課程卡常整批重畫，用 requestAnimationFrame 合併成一次處理，避免重複計算
  let queued = false;
  function scan() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () {
      queued = false;
      document.querySelectorAll(CARD_SELECTOR).forEach(applyBar);
    });
  }

  new MutationObserver(scan).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ['style']
  });
  document.addEventListener('DOMContentLoaded', scan);
})();

</script>

<script>
const DAY_START_MIN=8*60;
const DAY_END_MIN=22*60; // 最晚結束時間 22:00（Carbon 版由 21:00 延長）
function minToTime_(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
const TIME_POINTS=[];
for(let m=DAY_START_MIN;m<=DAY_END_MIN;m+=30) TIME_POINTS.push(minToTime_(m));
const TIME_SLOTS=[];
for(let m=DAY_START_MIN;m<DAY_END_MIN;m+=30) TIME_SLOTS.push({code:minToTime_(m),label:minToTime_(m)});
let allRooms=[],filteredRooms=[],courses=[],selectedCourse=null,currentView='day',currentDate='',calendarBase=new Date(),pendingConflictResolver=null,pendingRetry=null,tempOrder=[];
let selectedRoomNames=new Set();
let monthCache={};
let lastScheduleVersion='';
let schedulePollTimer=null;
let schedulePollBusy=false;


function setTheme(mode){
  const theme=mode==='dark'?'dark':'light';
  document.documentElement.setAttribute('data-theme',theme);
  try{localStorage.setItem('classroomAdminTheme',theme);}catch(e){}
  const light=document.getElementById('themeLight'),dark=document.getElementById('themeDark');
  if(light)light.classList.toggle('active',theme==='light');
  if(dark)dark.classList.toggle('active',theme==='dark');
  const mobileThemeBtn=document.getElementById('mobileThemeBtn');
  if(mobileThemeBtn)mobileThemeBtn.innerHTML=theme==='dark'?LUCIDE.moon:LUCIDE.sun; /* Lucide 圖示 */
}
function initTheme(){
  let saved='light';
  try{saved=localStorage.getItem('classroomAdminTheme')||'light';}catch(e){}
  setTheme(saved);
}

function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  setTheme(next);
  updateMobileHeader_();
}
function shiftDay(n){onDateChange(addDays(currentDate,n));}


window.onload=async()=>{
  initTheme();
  currentDate=formatDate(new Date());
  calendarBase=parseDate(currentDate);
  currentView='day';
  updateMobileHeader_();
  try{
    await loadRooms();
  }catch(e){
    console.error(e);
    const el=document.getElementById('mobileDayView');
    if(el)el.innerHTML='<div class="agenda-empty">課表載入失敗，請重新整理頁面</div>';
  }
};
function server(fn,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));}
function startSchedulePolling_(){
  if(schedulePollTimer)clearInterval(schedulePollTimer);
  schedulePollTimer=setInterval(checkScheduleVersion_,5000);
}
async function checkScheduleVersion_(){
  if(schedulePollBusy||document.hidden)return;
  schedulePollBusy=true;
  try{
    const version=String(await server('getScheduleVersion')||'');
    if(!lastScheduleVersion){lastScheduleVersion=version;return;}
    if(version&&version!==lastScheduleVersion){
      await refreshMobileVisibleSchedule_();
      lastScheduleVersion=version;
    }
  }catch(e){console.warn('Mobile 自動同步檢查失敗',e);}
  finally{schedulePollBusy=false;}
}
function clearMonthCacheForRange_(start,end){
  let d=parseDate(start),e=parseDate(end);
  d=new Date(d.getFullYear(),d.getMonth(),1);
  while(d<=e){
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    delete monthCache[key];
    if(typeof monthInflight!=='undefined')delete monthInflight[key];
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
}
async function refreshMobileVisibleSchedule_(){
  if(currentView==='day'){
    const key=monthKey_(currentDate);
    delete monthCache[key];
    if(typeof monthInflight!=='undefined')delete monthInflight[key];
    await loadDay(true);
    return;
  }
  if(currentView==='week'){
    const d=parseDate(currentDate),dow=d.getDay();
    const start=addDays(currentDate,-dow),end=addDays(start,6);
    clearMonthCacheForRange_(start,end);
    await renderMobileWeek_();
    return;
  }
  const key=monthKey_(currentDate);
  delete monthCache[key];
  if(typeof monthInflight!=='undefined')delete monthInflight[key];
  await renderMobileMonth_();
}


let mobileWeekSelectedDate='';
function mobileDateTitleText_(d){
  const dt=parseDate(d),w=['日','一','二','三','四','五','六'][dt.getDay()];
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日（${w}）`;
}
function updateMobileHeader_(){
  const el=document.getElementById('mobileDateTitle');
  if(el)el.textContent=mobileDateTitleText_(currentDate);
  const themeBtn=document.getElementById('mobileThemeBtn');
  if(themeBtn)themeBtn.innerHTML=document.documentElement.dataset.theme==='dark'?LUCIDE.moon:LUCIDE.sun; /* Lucide 圖示 */
}
function mobileFilteredCourses_(list){
  const roomSet=new Set(filteredRooms.map(r=>r.name));
  return (list||[]).filter(c=>roomSet.has(c.classroom));
}
function renderMobileSummary_(list){
  const el=document.getElementById('mobileSummaryText');if(!el)return;
  const count=(list||[]).length;
  const rooms=new Set((list||[]).map(c=>c.classroom)).size;
  el.textContent=`今日 ${count} 筆 · 使用 ${rooms} 間教室`;
}
function agendaCardHtml_(c){
  const bg=c.color||'#9fd0a8';
  const fg=textColor(bg);
  const meta=[
    c.classroom?`${LUCIDE.school}${esc(c.classroom)}`:'',
    c.department?`${LUCIDE.tag}${esc(c.department)}`:'',
    (c.startTime||c.endTime)?`${LUCIDE.clock}${esc(c.startTime||'')}–${esc(c.endTime||'')}`:'',
    c.person?`${LUCIDE.user}${esc(c.person)}`:'',
    c.useType?`${LUCIDE.bookmark}${esc(c.useType)}`:''
  ].filter(Boolean);
  return `<button class="agenda-card" style="background:${esc(bg)};color:${fg}" onclick='openMobileDetailById(${JSON.stringify(String(c.id))})'>
    <div class="agenda-card-title">${esc(c.title||'未命名課程')}</div>
    <div class="agenda-card-meta">${meta.map(x=>`<span>${x}</span>`).join('')}</div>
  </button>`;
}
function renderAgendaInto_(target,list,dateForSummary=null){
  const el=typeof target==='string'?document.getElementById(target):target;
  if(!el)return;
  const data=mobileFilteredCourses_(list).slice().sort((a,b)=>
    (a.startTime||'').localeCompare(b.startTime||'') ||
    (a.classroom||'').localeCompare(b.classroom||'')
  );
  if(dateForSummary)renderMobileSummary_(data);
  if(!data.length){
    el.innerHTML='<div class="agenda-empty">這一天目前沒有課程或借用紀錄</div>';
    return;
  }
  const groups={};
  data.forEach(c=>{
    const key=c.startTime||'未設定時間';
    (groups[key]||(groups[key]=[])).push(c);
  });
  el.innerHTML=Object.keys(groups).sort().map(time=>`
    <div class="agenda-time-group">
      <div class="agenda-time-label">${esc(time)}</div>
      ${groups[time].map(agendaCardHtml_).join('')}
    </div>
  `).join('');
}
function renderMobileDay_(){
  renderAgendaInto_('mobileDayView',courses,currentDate);
}
async function renderMobileWeek_(){
  const d=parseDate(currentDate),dow=d.getDay();
  const start=addDays(currentDate,-dow);
  const end=addDays(start,6);
  const data=await getRangeCached(start,end);window.__mobileRangeCache=data;
  if(!mobileWeekSelectedDate || mobileWeekSelectedDate<start || mobileWeekSelectedDate>end){
    mobileWeekSelectedDate=currentDate>=start&&currentDate<=end?currentDate:start;
  }
  const dates=[];for(let i=0;i<7;i++)dates.push(addDays(start,i));
  const el=document.getElementById('mobileWeekView');
  el.innerHTML=`<div class="mobile-week-tabs">${
    dates.map(d=>{
      const dt=parseDate(d),w=['日','一','二','三','四','五','六'][dt.getDay()];
      return `<button class="mobile-week-tab ${d===mobileWeekSelectedDate?'active':''}" onclick="selectMobileWeekDate('${d}')">${w}<b>${dt.getMonth()+1}/${dt.getDate()}</b></button>`;
    }).join('')
  }</div><div id="mobileWeekAgenda"></div>`;
  const list=data.filter(c=>c.date===mobileWeekSelectedDate);
  renderAgendaInto_('mobileWeekAgenda',list,null);
  document.getElementById('mobileSummaryText').textContent=`本週 ${mobileFilteredCourses_(data).length} 筆`;
}
function selectMobileWeekDate(d){
  mobileWeekSelectedDate=d;
  renderMobileWeek_();
}
let mobileMonthRenderSeq=0;

function buildMobileMonthHtml_(y,m,byDate={}){
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const firstDow=first.getDay(),prevDays=new Date(y,m,0).getDate();
  const cells=[];

  for(let i=firstDow-1;i>=0;i--){
    const day=prevDays-i,d=formatDate(new Date(y,m-1,day));
    cells.push({d,day,muted:true});
  }
  for(let day=1;day<=last.getDate();day++){
    cells.push({d:formatDate(new Date(y,m,day)),day,muted:false});
  }
  while(cells.length%7!==0){
    const day=cells.length-(firstDow+last.getDate())+1;
    const d=formatDate(new Date(y,m+1,day));
    cells.push({d,day,muted:true});
  }

  return `<div class="mobile-month-card">
    <div class="mobile-month-head">
      <button onclick="moveMobileMonth(-1)">‹</button>
      <strong>${y}年${m+1}月</strong>
      <button onclick="moveMobileMonth(1)">›</button>
    </div>
    <div class="mobile-month-grid">
      ${['日','一','二','三','四','五','六'].map(w=>`<div class="mobile-month-week">${w}</div>`).join('')}
      ${cells.map(x=>{
        const arr=byDate[x.d]||[];
        const dots=arr.slice(0,6).map(c=>`<i style="background:${esc(c.color||'#9fd0a8')}"></i>`).join('');
        return `<button class="mobile-month-day ${x.muted?'muted':''} ${x.d===currentDate?'selected':''}" onclick="selectMobileMonthDate('${x.d}')">
          <span>${x.day}</span><span class="mobile-month-dots">${dots}</span>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

async function renderMobileMonth_(){
  const seq=++mobileMonthRenderSeq;
  const dt=parseDate(currentDate),y=dt.getFullYear(),m=dt.getMonth();
  const key=`${y}-${String(m+1).padStart(2,'0')}`;
  const el=document.getElementById('mobileMonthView');
  if(!el)return;

  // 先立即畫出月份，不等待 Apps Script。
  const cached=monthCache[key];
  if(!cached){
    el.innerHTML=buildMobileMonthHtml_(y,m,{});
    const summary=document.getElementById('mobileSummaryText');
    if(summary)summary.textContent='本月課程載入中…';
  }

  try{
    const raw=cached || await fetchMonthCached_(key+'-01');
    if(seq!==mobileMonthRenderSeq || monthKey_(currentDate)!==key)return;

    window.__mobileRangeCache=raw;
    const data=mobileFilteredCourses_(raw);
    const byDate={};
    data.forEach(c=>(byDate[c.date]||(byDate[c.date]=[])).push(c));

    el.innerHTML=buildMobileMonthHtml_(y,m,byDate);
    const summary=document.getElementById('mobileSummaryText');
    if(summary)summary.textContent=`本月 ${data.length} 筆`;

    // 當月完成後，背景預抓前後月份。
    prefetchAdjacentMonths_(currentDate);
  }catch(e){
    console.error(e);
    if(seq!==mobileMonthRenderSeq)return;
    const summary=document.getElementById('mobileSummaryText');
    if(summary)summary.textContent='月份資料載入失敗';
  }
}
function moveMobileMonth(delta){
  const d=parseDate(currentDate);
  const next=formatDate(new Date(d.getFullYear(),d.getMonth()+delta,1));
  currentDate=next;
  calendarBase=parseDate(next);
  updateMobileHeader_();

  // 不 await：畫面先立刻換月份，資料色點背景補上。
  renderMobileMonth_();
}
async function selectMobileMonthDate(d){
  currentDate=d;calendarBase=parseDate(d);
  await switchView('day');
}
function openMobileCalendar(){
  switchView('month');
}
function openMobileDetailById(id){
  const all=[...(courses||[])];
  const c=all.find(x=>String(x.id)===String(id)) || window.__mobileRangeCache?.find?.(x=>String(x.id)===String(id));
  if(!c)return;
  const rows=[];
  const add=(k,v)=>{if(v)rows.push(`<div class="mobile-detail-row"><span class="k">${esc(k)}</span><span>${esc(v)}</span></div>`);};
  add('系所',c.department);
  add('日期',c.date);
  add('教室',c.classroom);
  add('時間',[c.startTime,c.endTime].filter(Boolean).join(' ～ '));
  add('教師/借用人',c.person);
  add('使用性質',c.useType);
  add('備註',c.note);

function formatDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return formatDate(d);}
function weekdayZh(d){return ['日','一','二','三','四','五','六'][d.getDay()];}

  try{

function loadRoomOrder(){const saved=JSON.parse(localStorage.getItem('room_order_v2')||'[]');if(!saved.length)return;const map=new Map(allRooms.map(r=>[r.name,r]));const ordered=[];saved.forEach(x=>{if(map.has(x.name)){ordered.push({...map.get(x.name),visible:x.visible!==false});map.delete(x.name)}});map.forEach(r=>ordered.push({...r,visible:true}));allRooms=ordered;}
function populateFilters(){
  const cat=document.getElementById('categorySelect');
  const oldCat=cat.value||'全部';
  const preferredOrder=['全部','100人以上','50-100人','50人以下','其他'];
  const roomCategories=[...new Set(allRooms.map(r=>r.category).filter(Boolean))];
  const categories=preferredOrder.filter(x=>x==='全部'||roomCategories.includes(x));
  roomCategories.forEach(x=>{if(!categories.includes(x))categories.push(x);});
  cat.innerHTML=categories.map(x=>`<option value="${esc(x)}">${esc(x==='全部'?'全部容量':x)}</option>`).join('');
  if([...cat.options].some(o=>o.value===oldCat))cat.value=oldCat;
  populateRoomSelect();
  updateRoomFilterButton_();
}
function populateRoomSelect(){const el=document.getElementById('m_classroom');if(!el)return;el.innerHTML=allRooms.filter(r=>r.visible!==false).map(r=>`<option value="${esc(r.name)}">${esc(r.name)} (${esc(r.capacity||'')}人)</option>`).join('');}

function syncRoomSelections_(forceAll=false){
  const visible=allRooms.filter(r=>r.visible!==false).map(r=>r.name);
  const valid=new Set(visible);
  if(forceAll||selectedRoomNames.size===0){
    selectedRoomNames=new Set(visible);
  }else{
    selectedRoomNames=new Set([...selectedRoomNames].filter(name=>valid.has(name)));
  }
  updateRoomFilterButton_();
}
function updateRoomFilterButton_(){
  const el=document.getElementById('roomFilterCount');
  if(!el)return;
  const total=allRooms.filter(r=>r.visible!==false).length;
  const count=[...selectedRoomNames].filter(name=>allRooms.some(r=>r.name===name&&r.visible!==false)).length;
  el.textContent=count>=total?'全部':`${count}/${total}`;
}
function openRoomFilterModal(){

    <label class="room-check-item">
      <input class="room-filter-check" type="checkbox" value="${esc(r.name)}" ${selectedRoomNames.has(r.name)?'checked':''} onchange="updateRoomFilterModalCount_()">

async function loadDay(force=false,existingToken=null){
  updateTitle();
  try{
    const month=await ensureMonthLoaded(currentDate,force);
    courses=clone(month.filter(c=>c.date===currentDate));
    updateMobileHeader_();
    if(currentView==='day')renderMobileDay_();
  }catch(e){console.error(e);toast('讀取課程失敗');}
}
function clone(x){return JSON.parse(JSON.stringify(x||[]));}

function monthKey_(dateStr){return String(dateStr||'').slice(0,7);}

const monthInflight={};

function monthDateFromKey_(key){
  return key+'-01';
}

async function fetchMonthCached_(dateStr,force=false){
  const key=monthKey_(dateStr);
  if(!force && monthCache[key])return monthCache[key];

  // 同一月份若已經正在抓，直接共用同一個 Promise，避免重複查詢。
  if(!force && monthInflight[key])return monthInflight[key];

  monthInflight[key]=server('getCoursesByMonth',[monthDateFromKey_(key)])
    .then(data=>{
      monthCache[key]=Array.isArray(data)?data:[];
      return monthCache[key];
    })
    .finally(()=>{delete monthInflight[key];});

  return monthInflight[key];
}

function prefetchAdjacentMonths_(dateStr){
  const d=parseDate(dateStr);
  [-1,1].forEach(delta=>{
    const target=formatDate(new Date(d.getFullYear(),d.getMonth()+delta,1));
    const key=monthKey_(target);
    if(!monthCache[key]&&!monthInflight[key]){
      // 背景預抓，不阻塞畫面。
      fetchMonthCached_(target).catch(()=>{});
    }
  });
}

async function ensureMonthLoaded(dateStr,force=false){
  return fetchMonthCached_(dateStr,force);
}
async function getRangeCached(start,end){
  const keys=[];
  let d=parseDate(start),e=parseDate(end);
  d=new Date(d.getFullYear(),d.getMonth(),1);
  while(d<=e){
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  const arrays=await Promise.all(keys.map(key=>fetchMonthCached_(key+'-01')));
  return arrays.flat().filter(c=>c.date>=start&&c.date<=end);
}

function textColor(hex){if(!/^#[0-9a-f]{6}$/i.test(hex||''))return'#20304a';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (r*299+g*587+b*114)/1000>155?'#20304a':'#fff';}
