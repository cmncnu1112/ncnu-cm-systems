<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電視牆跑馬燈申請管理後台</title>
  <!--
    ===== GitHub Pages 版設定（2026-11 由 GAS HtmlService 搬出） =====
    1. GAS 後端網址寫在同資料夾的 config.js（前台、後台共用，只需改一處）。
    2. gas-shim.js 模擬 google.script.run，下方 api()／adminApi() 不需修改。
    3. 後端以 'AUTH:'、'STALE:' 開頭的錯誤訊息會原樣傳回，登入失效與資料過期的處理照常運作。
  -->
  <script src="./config.js?v=1"></script>
  <script src="../shared/gas-shim.js?v=3"></script>
<!-- 管院後台共用登入：一次登入，所有系統後台通行（設定說明見 shared/admin-sso.js） -->
<script>window.CM_ADMIN = {"tokenKey": "tvWallAdminToken", "loginFn": "adminLogin", "logoutFn": "adminLogout"};</script>
<script src="../shared/sso-config.js?v=1"></script>
<script src="../shared/admin-sso.js?v=1"></script>
  <!-- 英數字字型 IBM Plex Sans；中文自動落到微軟正黑體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <!--
    電視牆跑馬燈申請系統 後台 Admin.html  V1.2.0（登入畫面比照對外廠商請購系統）
    版面：管院系統起手模板 V2.5.6；規格：管院行政系統 介面模板交接手冊
    功能：待審核、已核准、待撤檔、全部申請、處理紀錄；審核、結案、撤檔確認、影片收件標記
    資料更新：每 15 秒背景重讀，不會清掉抽屜內正在填的欄位
  -->
  <style>

    /* =========================================================
       管院行政系統 起手模板（依鑰匙設備庫存後台 V2.5.6 實際呈現值）
       結構採 Carbon Design System；色彩採管院深藍＋琥珀橘。
       本檔不依賴 Tailwind，可直接當成新系統的 HTML 起點。
       ========================================================= */
    :root{
      /* ---------- 品牌色 ---------- */
      --navy:#1e3a8a;        /* 主色：頂欄、主要按鈕、選取線、勾選框 */
      --navy-dark:#172b66;   /* 主色滑過 */
      --navy-press:#0f1d45;  /* 主色按下 */
      --navy-soft:#e8eefc;   /* 淡藍：品牌類小標籤 */
      --floor-row:#edf1fb;   /* 表格分組列 */
      --amber:#d97706;       /* 琥珀橘：徽章、警示數字、提示條色條 */

      /* ---------- 中性色（Carbon Gray 10） ---------- */
      --bg:#f4f4f4;            /* 頁面背景 */
      --layer:#ffffff;         /* 面板、表格、抽屜 */
      --field:#f4f4f4;         /* 輸入框底色 */
      --layer-hover:#e8e8e8;   /* 滑過 */
      --layer-active:#e0e0e0;  /* 表頭、選取底色 */
      --border-subtle:#e0e0e0; /* 細分隔線 */
      --border-strong:#8d8d8d; /* 輸入框底線 */
      --disabled:#c6c6c6;      /* 停用 */
      --placeholder:#a8a8a8;   /* 提示文字 */
      --ink:#161616;           /* 主要文字 */
      --muted:#525252;         /* 次要文字 */
      --helper:#6f6f6f;        /* 說明文字 */
      --focus:var(--navy);     /* 聚焦框 */

      /* ---------- 狀態色（底色／文字） ---------- */
      --ok-bg:#defbe6;   --ok:#0e6027;    /* 可用、開放、白名單 */
      --out-bg:#fff1f1;  --out:#a2191f;   /* 佔用、黑名單、異常 */
      --warn-bg:#fcf4d6; --warn:#8e6a00;  /* 待處理；提示條底色 */
      --mute-bg:#e0e0e0; --mute:#161616;  /* 一般、不適用 */

      /* ---------- 危險操作 ---------- */
      --danger:#da1e28;
      --danger-hover:#b81921;
      --danger-row:#fff1f1;
      --danger-row-hover:#ffd7d9;

      /* ---------- 提示訊息 ---------- */
      --toast-ok:#059669;
      --toast-err:#e11d48;
      --toast-info:#262626;
    }

    /* ===== 基礎 ===== */
    *{box-sizing:border-box;margin:0;padding:0}
    body,button,input,select,textarea{
      font-family:"IBM Plex Sans","Microsoft JhengHei","微軟正黑體",ui-sans-serif,system-ui,sans-serif;
      letter-spacing:.16px;
    }
    body{background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
    .rounded-circle{border-radius:50%}   /* 唯一允許的圓形：步驟數字、轉圈 */

    /* ===== Lucide 圖示 ===== */
    .licon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex-shrink:0;stroke-width:2}
    .licon-sm{width:1em;height:1em}
    .licon-lg{width:1.5em;height:1.5em}
    .licon-xl{width:2.5rem;height:2.5rem}

    /* ===== 頂欄：48px 深藍 ===== */
    .topbar{position:sticky;top:0;z-index:30;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px}
    .topbar h1{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
    .topbar .updated{font-size:11px;color:#c6c6c6;display:none}
    .topbar .btn-top{height:32px;padding:0 12px;border:0;background:#fff;color:var(--ink);font-size:12px;font-weight:900;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
    @media (min-width:640px){
      .topbar{padding:0 24px}
      .topbar h1{font-size:16px}
      .topbar .updated{display:inline}
    }

    /* ===== 外框：側欄＋主區 ===== */
    .shell{display:flex;flex-direction:column;align-items:flex-start;width:100%}
    @media (min-width:768px){.shell{flex-direction:row}}

    /* ===== 側欄：桌機 208px 直向；手機橫向頁籤 ===== */
    .nav-v2{width:100%;background:var(--layer);padding:8px 0;display:flex;overflow-x:auto;border-bottom:1px solid var(--border-subtle)}
    .nav-btn{flex:0 0 auto;height:40px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;color:var(--muted);font-size:14px;text-align:left;cursor:pointer;white-space:nowrap}
    .nav-btn:hover{background:var(--layer-hover);color:var(--ink)}
    .nav-btn.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--navy)}   /* 手機：底部 2px 線 */
    .nav-btn .count{height:18px;line-height:18px;min-width:20px;padding:0 6px;font-size:12px;text-align:center;background:var(--amber);color:#fff}
    @media (min-width:768px){
      .nav-v2{width:208px;flex-shrink:0;flex-direction:column;position:sticky;top:48px;align-self:flex-start;min-height:calc(100vh - 48px);overflow:visible;border-bottom:0}
      .nav-btn{width:100%}
      .nav-btn.on{background:var(--layer-active);box-shadow:inset 3px 0 0 var(--navy)}  /* 桌機：左側 3px 線 */
    }

    /* ===== 主區：一定要 w-full + min-w-0，避免寬表格撐破手機版面 ===== */
    .main{flex:1;min-width:0;width:100%;padding:16px;display:flex;flex-direction:column;gap:16px}
    @media (min-width:640px){.main{padding:24px}}

    /* ===== KPI 磚：2／3／5 欄，間隔 1px 露出背景色 ===== */
    .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--bg)}
    @media (min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}}
    @media (min-width:1024px){.kpis{grid-template-columns:repeat(5,1fr)}}
    .kpi{background:var(--layer);padding:16px}
    .kpi small{display:block;font-size:12px;letter-spacing:.32px;color:var(--muted)}
    .kpi b{display:block;font-size:28px;font-weight:600;line-height:1.4;padding-top:2px;margin-top:2px;color:var(--navy);font-variant-numeric:tabular-nums}
    .kpi.alert b{color:var(--amber)}

    /* ===== 需要處理提示條 ===== */
    .attn{background:var(--warn-bg);border-left:3px solid var(--amber);padding:12px 16px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
    .attn strong{font-weight:600}
    .attn a{color:var(--navy);text-decoration:underline;cursor:pointer}

    /* ===== 面板與工具列 ===== */
    .panel-v2{background:var(--layer)}
    .toolbar-v2{min-height:48px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px}
    .toolbar-v2 h2{font-size:20px;font-weight:400}
    .toolbar-v2 .sp{flex:1}

    /* ===== 輸入框：無外框、底線、聚焦 2px 深藍內框 ===== */
    input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],select,textarea{
      border:0;border-bottom:1px solid var(--border-strong);border-radius:0;background:var(--field);color:var(--ink);font-size:14px;padding:0 12px;
    }
    input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-2px}
    input::placeholder,textarea::placeholder{color:var(--placeholder)}
    input:disabled,select:disabled,textarea:disabled{color:#8d8d8d;border-bottom-color:transparent;cursor:not-allowed}
    .field-v2{height:32px;min-width:200px}

    /* ===== 按鈕：small 32px；抽屜底部 large 48px ===== */
    .btn-v2{height:32px;padding:0 16px;border:0;border-radius:0;font-size:14px;font-weight:400;letter-spacing:.16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:pointer;transition:background .07s;vertical-align:middle}
    .btn-v2 + .btn-v2{margin-left:4px}
    .btn-v2.pri{background:var(--navy);color:#fff}
    .btn-v2.pri:hover{background:var(--navy-dark)}
    .btn-v2.pri:active{background:var(--navy-press)}
    .btn-v2.ghost{background:transparent;color:var(--navy)}
    .btn-v2.ghost:hover{background:var(--layer-hover)}
    .btn-v2.danger{background:var(--danger);color:#fff}
    .btn-v2.danger:hover{background:var(--danger-hover)}
    .btn-v2.danger-ghost{background:transparent;color:var(--danger)}
    .btn-v2.danger-ghost:hover{background:var(--danger);color:#fff}
    .btn-v2:disabled{background:var(--disabled)!important;color:#8d8d8d!important;cursor:not-allowed}
    button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;box-shadow:inset 0 0 0 3px #fff}

    /* ===== 資料表格 ===== */
    .table-wrap{overflow-x:auto}   /* 手機：只有表格自己橫向捲動 */
    .table-v2{width:100%;min-width:800px;border-collapse:collapse}
    .table-v2 th{height:48px;background:var(--layer-active);text-align:left;font-size:14px;font-weight:600;padding:0 16px;white-space:nowrap}
    .table-v2 td{height:48px;padding:6px 16px;font-size:14px;vertical-align:middle;border-bottom:1px solid var(--border-subtle)}
    .table-v2 td:last-child{width:1%;white-space:nowrap}   /* 操作欄：最後一欄、不換行 */
    .table-v2 tbody tr:not(.floor-v2):hover{background:var(--layer-hover)}
    .table-v2 td .sub{display:block;font-size:12px;color:var(--muted)}
    .floor-v2 td{background:var(--floor-row);color:var(--navy);font-weight:600}
    .table-v2 tbody tr.row-blacklist{background:var(--danger-row)}
    .table-v2 tbody tr.row-blacklist:hover{background:var(--danger-row-hover)}
    .table-v2 tbody tr.row-disabled td{color:#8d8d8d}

    /* ===== 狀態標籤與小標籤：直角、淡底深字 ===== */
    .tag-v2{display:inline-block;height:24px;line-height:24px;padding:0 8px;font-size:12px;white-space:nowrap}
    .tag-v2.ok{background:var(--ok-bg);color:var(--ok)}
    .tag-v2.out{background:var(--out-bg);color:var(--out)}
    .tag-v2.warn{background:var(--warn-bg);color:var(--warn)}
    .tag-v2.mute{background:var(--mute-bg);color:var(--mute)}
    .chip-v2{display:inline-block;height:24px;line-height:24px;padding:0 8px;font-size:12px;margin:2px 4px 2px 0;white-space:nowrap}
    .chip-v2.key{background:var(--navy-soft);color:var(--navy)}
    .chip-v2.eq{background:var(--layer-active);color:var(--ink)}

    /* ===== 勾選框（取代開關） ===== */
    .check-v2{display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none;position:relative}
    .check-v2 input{position:absolute;opacity:0;width:1px;height:1px}
    .check-box{flex-shrink:0;position:relative;width:18px;height:18px;margin-top:2px;border:1px solid #161616;border-radius:2px;background:#fff;transition:background .07s}
    .check-v2 input:checked + .check-box{background:var(--navy);border-color:var(--navy)}
    .check-v2 input:checked + .check-box::after{content:'';position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
    .check-v2 input:focus-visible + .check-box{outline:2px solid var(--focus);outline-offset:1px}
    .check-v2:hover .check-box{border-color:var(--navy)}
    .check-v2 input:disabled + .check-box{border-color:var(--disabled);background:var(--bg)}
    .check-v2 input:disabled ~ .check-text{color:#8d8d8d;cursor:not-allowed}
    .check-text{display:flex;flex-direction:column;gap:2px;font-size:14px}
    .check-text small{font-size:12px;color:var(--helper)}

    /* ===== 單選列表 ===== */
    .radio-group-v2{display:grid;border-top:1px solid var(--border-subtle)}
    .radio-v2{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--border-subtle);cursor:pointer}
    .radio-v2:hover{background:var(--layer-hover)}
    .radio-v2 input{width:18px;height:18px;margin-top:2px;accent-color:var(--navy);flex-shrink:0}
    .radio-v2 span{display:flex;flex-direction:column;gap:2px;font-size:14px}
    .radio-v2 small{font-size:12px;color:var(--helper)}

    /* ===== 抽屜：桌機貼右 400px；1024px 以下置中彈窗 ===== */
    .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.4);backdrop-filter:blur(4px)}
    .overlay.open{display:flex}
    .overlay.danger-layer{z-index:60}   /* 刪除確認要蓋過抽屜 */
    .drawer-v2{width:100%;max-width:576px;max-height:90vh;background:var(--layer);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.25)}
    .drawer-v2.sm{max-width:448px}
    @media (min-width:1024px){
      .overlay.side{padding:0;justify-content:flex-end;align-items:stretch;background:transparent;backdrop-filter:none}
      .overlay.side .drawer-v2{width:400px;max-width:400px;max-height:none;height:100%;box-shadow:-8px 0 24px rgba(15,23,42,.10)}
    }
    .drawer-v2 header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--navy);color:#fff}
    .drawer-v2 header.danger{background:var(--danger)}
    .drawer-v2 header small{font-size:12px;opacity:.75}
    .drawer-v2 header h3{font-size:20px;font-weight:400;margin-top:2px}
    .drawer-close{width:32px;height:32px;border:0;background:transparent;color:#fff;cursor:pointer;flex-shrink:0;font-size:16px}
    .drawer-close:hover{background:rgba(255,255,255,.12)}
    .drawer-v2 .body{flex:1;overflow-y:auto;padding:16px 20px}
    .drawer-v2 .field-group{margin-top:16px}
    .drawer-v2 .field-group:first-child{margin-top:0}
    .drawer-v2 .field-label{display:block;font-size:12px;letter-spacing:.32px;color:var(--muted);margin-bottom:6px}
    .drawer-v2 .field-help{font-size:12px;letter-spacing:.32px;color:var(--helper);margin-top:4px}
    /* 勾選框與單選鈕不套用 40px 整寬，否則會被撐大 */
    .drawer-v2 input:not([type=radio]):not([type=checkbox]),.drawer-v2 select{height:40px;width:100%}
    .drawer-v2 textarea{width:100%;padding:10px 12px;resize:vertical}
    .drawer-v2 .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-subtle)}
    .drawer-v2 .row .nm{flex:1;min-width:0}
    .drawer-v2 .row .nm b{display:flex;align-items:center;gap:6px}
    .drawer-v2 .row .nm small{display:block;margin-top:2px;font-size:12px;color:var(--helper)}
    .drawer-v2 .foot{display:grid;gap:10px;padding:16px 20px;background:var(--layer)}
    .drawer-v2 .foot .btn-v2{height:48px;width:100%;justify-content:flex-start;margin-left:0}

    /* ===== 數量調整器 ===== */
    .stepper-v2{display:flex;align-items:center;background:var(--field)}
    .stepper-v2 button{width:36px;height:36px;border:0;background:none;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .stepper-v2 button:hover{background:var(--layer-hover)}
    .stepper-v2 span{min-width:32px;text-align:center;font-weight:600}

    /* ===== 提示訊息與空狀態 ===== */
    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:70;max-width:90vw;padding:12px 16px;font-size:12px;font-weight:700;color:#fff;display:none;box-shadow:0 10px 24px rgba(0,0,0,.2)}
    .toast.show{display:block}
    .toast.ok{background:var(--toast-ok)}
    .toast.err{background:var(--toast-err)}
    .toast.info{background:var(--toast-info)}
    .empty{padding:64px 16px;text-align:center}
    .empty .ico{width:56px;height:56px;margin:0 auto;background:var(--bg);color:var(--helper);display:flex;align-items:center;justify-content:center}
    .empty h3{font-size:14px;font-weight:900;margin-top:16px}
    .empty p{font-size:12px;color:var(--helper);margin-top:4px}
  

    /* =========================================================
       電視牆跑馬燈申請系統 追加樣式（沿用起手模板變數，不新增色碼）
       ========================================================= */

    /* ===== 頁面表單：欄位規格與抽屜相同（名稱 12px → 輸入框 40px → 說明） ===== */
    .form-body{padding:16px}
    .form-body .field-group{margin-top:16px}
    .form-body .field-group:first-child{margin-top:0}
    .field-label{display:block;font-size:12px;letter-spacing:.32px;color:var(--muted);margin-bottom:6px}
    .field-help{font-size:12px;letter-spacing:.32px;color:var(--helper);margin-top:4px}
    .form-body input:not([type=radio]):not([type=checkbox]):not([type=file]),.form-body select{height:40px;width:100%}
    .form-body textarea{width:100%;padding:10px 12px;resize:vertical}
    .form-section{margin-top:24px;padding-top:16px;border-top:1px solid var(--border-subtle)}
    .form-section > h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .grid-2{display:grid;grid-template-columns:1fr;gap:16px}
    @media (min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
    .grid-2 .field-group{margin-top:0!important}
    .inline-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
    .inline-row > .grow{flex:1;min-width:160px}
    .check-list{display:grid;gap:12px}
    .counter{float:right;font-size:12px;color:var(--helper);font-variant-numeric:tabular-nums}
    .counter.over{color:var(--danger)}
    .form-foot{padding:16px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--border-subtle)}
    .form-foot .btn-v2{height:48px;min-width:200px;justify-content:flex-start}
    .form-foot .btn-v2 + .btn-v2{margin-left:0}

    /* 文字閱讀為主的頁面可以單獨加 960px 最大寬度（交接手冊 7.5） */
    .page-narrow{width:100%;max-width:960px;display:flex;flex-direction:column;gap:16px}

    /* ===== 檔案選擇：隱藏原生樣式，改用按鈕 ===== */
    .file-pick{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
    .file-pick input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
    .file-name{font-size:12px;color:var(--helper)}
    .img-preview{margin-top:12px;background:var(--layer-active);display:none}
    .img-preview.show{display:block}
    .img-preview img{display:block;max-width:100%;max-height:320px;margin:0 auto}
    .img-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

    /* ===== 送出結果：查詢碼 ===== */
    .result-box{padding:24px 16px}
    .result-box h3{font-size:20px;font-weight:400;display:flex;align-items:center;gap:8px}
    .code-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--bg);margin-top:16px}
    @media (min-width:640px){.code-grid{grid-template-columns:1fr 1fr}}
    .code-grid > div{background:var(--navy-soft);padding:16px}
    .code-grid small{display:block;font-size:12px;letter-spacing:.32px;color:var(--muted)}
    .code-grid b{display:block;font-size:28px;font-weight:600;line-height:1.4;padding-top:2px;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:2px}

    /* ===== 申請須知 ===== */
    .rules{padding:16px;line-height:1.8}
    .rules ol{padding-left:24px}
    .rules li{margin:4px 0}
    .rules .strong{color:var(--danger);font-weight:600}
    .rules h3{font-size:14px;font-weight:600;margin:16px 0 4px}
    .rules h3:first-child{margin-top:0}

    /* ===== 抽屜內的詳細資料清單 ===== */
    .dl{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--border-subtle)}
    .dl dt,.dl dd{padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:14px}
    .dl dt{font-size:12px;letter-spacing:.32px;color:var(--muted);padding-top:12px}
    .dl dd{word-break:break-word;white-space:pre-wrap}
    .sec-title{font-size:12px;letter-spacing:.32px;color:var(--navy);font-weight:600;margin:20px 0 8px}
    .sec-title:first-child{margin-top:0}

    /* ===== 讀取中：唯一允許的圓形 ===== */
    .loading{padding:64px 16px;text-align:center;color:var(--helper);font-size:12px}
    .spin{width:36px;height:36px;margin:0 auto 12px;border:3px solid var(--layer-active);border-top-color:var(--navy);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== 其他 ===== */
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .nowrap{white-space:nowrap}
    .link{color:var(--navy);text-decoration:underline;cursor:pointer;background:none;border:0;font-size:inherit;padding:0}
    .more-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;font-size:12px;color:var(--helper)}
    .table-v2 td .clip{display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


    /* ===== 登入畫面（比照對外廠商請購系統） ===== */
    /* 密碼欄位：模板原本沒有 password 類型，補上與其他輸入框相同的樣式；點點字距加大比較好數 */
    input[type=password]{border:0;border-bottom:1px solid var(--border-strong);border-radius:0;background:var(--field);color:var(--ink);font-size:14px;padding:0 12px;letter-spacing:2px}
    /* 沿用主區與面板樣式，靠左上，不做置中卡片 */
    body.locked .shell,body.locked .topbar .right{display:none}
    #loginView{display:none;padding:16px}
    body.locked #loginView{display:block}
    @media (min-width:640px){#loginView{padding:24px}}
    .login-form{padding:4px 16px 24px;max-width:400px}
    .login-form label{display:block;font-size:12px;letter-spacing:.32px;color:var(--muted);margin-bottom:6px}
    .login-form input{width:100%;height:40px}
    .login-form .field-help{font-size:12px;letter-spacing:.32px;color:var(--helper);margin-top:4px}
    .login-form .err{font-size:12px;color:var(--out);margin-top:8px;min-height:18px}
    .login-form .btn-v2{height:48px;width:100%;justify-content:flex-start;margin-top:16px}
  </style>
</head>
<body>
  <!-- ===== 頂欄 ===== -->
  <header class="topbar">
    <h1 id="sysName">電視牆跑馬燈申請管理後台</h1>
    <div class="right">
      <span class="updated" id="lastUpdated">尚未更新</span>
      <button class="btn-top" type="button" onclick="refresh(true)"><span data-icon="refresh-cw"></span>重新整理</button>
      <button class="btn-top" type="button" onclick="logout()"><span data-icon="log-out"></span>登出</button>
    </div>
  </header>

  <!-- ===== 登入畫面：body 有 locked 時顯示，並隱藏後台（比照對外廠商請購系統） ===== -->
  <section id="loginView">
    <div class="panel-v2">
      <div class="toolbar-v2"><h2>登入後台</h2></div>
      <form class="login-form" onsubmit="event.preventDefault();doLogin()">
        <label for="loginPwd">後台密碼 *</label>
        <input type="password" id="loginPwd" autocomplete="current-password">
        <p class="field-help">密碼由院辦管理。登入後 6 小時內沒有操作會自動登出。</p>
        <p class="err" id="loginErr" role="alert"></p>
        <button class="btn-v2 pri" type="submit" id="btnLogin">登入</button>
      </form>
    </div>
  </section>

  <div class="shell">
    <!-- ===== 側欄：頁籤由 renderNav() 產生 ===== -->
    <nav class="nav-v2" id="nav"></nav>

    <!-- ===== 主區 ===== -->
    <main class="main">
      <div class="loading" id="bootLoading"><div class="spin rounded-circle"></div>讀取資料中…</div>

      <div id="appBody" class="hidden" style="display:flex;flex-direction:column;gap:16px">
        <!-- KPI 磚 -->
        <section class="kpis" id="kpis"></section>

        <!-- 需要處理提示條：沒有待辦時整條移除 -->
        <div class="attn hidden" id="attn"></div>

        <!-- 面板：工具列＋表格 -->
        <section class="panel-v2">
          <div class="toolbar-v2">
            <h2 id="panelTitle">待審核</h2>
            <span class="sp"></span>
            <input class="field-v2" type="search" id="searchBox" placeholder="搜尋編號 / 主題 / 單位 / 姓名 / 學號" oninput="onFilterChange()">
            <select class="field-v2 hidden" id="statusFilter" style="min-width:130px" onchange="onFilterChange()">
              <option value="">全部狀態</option>
              <option>待審核</option><option>已核准</option><option>審核不通過</option><option>已取消</option><option>已結案</option>
            </select>
            <button class="btn-v2 pri hidden" id="btnExpire" onclick="openExpireModal()"><span data-icon="circle-check"></span>結案過期檔期</button>
          </div>
          <div id="tableArea"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- ===== 申請詳細／審核抽屜 ===== -->
  <div class="overlay side" id="detailDrawer">
    <div class="drawer-v2" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <header>
        <div><small id="dEyebrow">REQUEST DETAIL</small><h3 id="dTitle">申請詳細</h3><small id="dSub"></small></div>
        <button class="drawer-close" aria-label="關閉" onclick="closeDetail()"><span data-icon="x"></span></button>
      </header>
      <div class="body" id="dBody"></div>
      <div class="foot" id="dFoot"></div>
    </div>
  </div>

  <!-- ===== 結案過期檔期確認 ===== -->
  <div class="overlay" id="expireModal">
    <div class="drawer-v2 sm" role="dialog" aria-modal="true" aria-labelledby="exTitle">
      <header>
        <div><small>COMPLETE EXPIRED</small><h3 id="exTitle">結案過期檔期</h3></div>
        <button class="drawer-close" aria-label="關閉" onclick="closeOverlay('expireModal')"><span data-icon="x"></span></button>
      </header>
      <div class="body">
        <p>下檔日已過的「已核准」申請共 <b id="exCount">0</b> 筆，確定全部改為「已結案」嗎？</p>
        <p class="field-help" style="margin-top:8px">系統每天凌晨 1 點也會自動結案，這裡用於需要立即整理清單時。</p>
        <div class="field-group">
          <label class="field-label" for="exStaff">處理人員 *</label>
          <select id="exStaff"></select>
        </div>
      </div>
      <div class="foot">
        <button class="btn-v2 pri" id="btnExConfirm" onclick="confirmExpire()">確認結案</button>
        <button class="btn-v2 ghost" onclick="closeOverlay('expireModal')">取消</button>
      </div>
    </div>
  </div>

  <!-- ===== 提示訊息 ===== -->
  <div class="toast" id="toast"></div>

  <script>
    /* ===== Lucide 圖示（https://lucide.dev，ISC 授權，v0.469.0），SVG 內嵌不需外部 CDN ===== */
    const LUCIDE={
      'air-vent':'<path d="M6 12H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><path d="M6 8h12" /><path d="M18.3 17.7a2.5 2.5 0 0 1-3.16 3.83 2.53 2.53 0 0 1-1.14-2V12" /><path d="M6.6 15.6A2 2 0 1 0 10 17v-5" />',
      'arrow-right-left':'<path d="m16 3 4 4-4 4" /><path d="M20 7H4" /><path d="m8 21-4-4 4-4" /><path d="M4 17h16" />',
      'building-2':'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" /><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" /><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" /><path d="M10 6h4" /><path d="M10 10h4" /><path d="M10 14h4" /><path d="M10 18h4" />',
      'calendar':'<path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" />',
      'inbox':'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />',
      'key-round':'<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /><circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />',
      'minus':'<path d="M5 12h14" />',
      'package':'<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" /><path d="m7.5 4.27 9 5.15" />',
      'plus':'<path d="M5 12h14" /><path d="M12 5v14" />',
      'refresh-cw':'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" />',
      'triangle-alert':'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" />',
      'x':'<path d="M18 6 6 18" /><path d="m6 6 12 12" />',
      /* ---- 本系統追加圖示（lucide.dev v0.469.0） ---- */
      'check':'<path d="M20 6 9 17l-5-5" />',
      'circle-check':'<circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" />',
      'external-link':'<path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />',
      'eye':'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" />',
      'film':'<rect width="18" height="18" x="3" y="3" rx="2" /><path d="M7 3v18" /><path d="M3 7.5h4" /><path d="M3 12h18" /><path d="M3 16.5h4" /><path d="M17 3v18" /><path d="M17 7.5h4" /><path d="M17 16.5h4" />',
      'history':'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" />',
      'image':'<rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />',
      'info':'<circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" />',
      'log-out':'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" x2="9" y1="12" y2="12" />',
      'lock':'<rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />',
      'monitor':'<rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" />',
      'search':'<circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />',
      'send':'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /><path d="m21.854 2.147-10.94 10.939" />',
      'type':'<polyline points="4 7 4 4 20 4 20 7" /><line x1="9" x2="15" y1="20" y2="20" /><line x1="12" x2="12" y1="4" y2="20" />',
      'upload':'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" x2="12" y1="3" y2="15" />',
      'user-round':'<circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" />'
    };

    function licon(name,cls){
      const body=LUCIDE[name];
      if(!body)return '';
      return '<svg class="licon'+(cls?' '+cls:'')+'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+body+'</svg>';
    }
    function hydrateIcons(root=document){
      root.querySelectorAll('[data-icon]').forEach(el=>{el.outerHTML=licon(el.dataset.icon);});
    }

    /* ===== 共用工具 ===== */
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    const $=id=>document.getElementById(id);
    function api(fn,...args){
      return new Promise((resolve,reject)=>{
        google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(String((err&&err.message)||err).replace(/^Error:\s*/,'')))) [fn](...args);
      });
    }
    function busy(btn,text='處理中…'){
      const html=btn.innerHTML;btn.disabled=true;btn.textContent=text;
      return ()=>{btn.disabled=false;btn.innerHTML=html;};
    }
    function showToast(msg,type='info'){
      const t=$('toast');t.textContent=msg;t.className='toast show '+type;
      clearTimeout(showToast._timer);showToast._timer=setTimeout(()=>t.classList.remove('show'),3500);
    }
    function closeOverlay(id){$(id).classList.remove('open');}
    function openOverlay(id){$(id).classList.add('open');}
    function charLen(s){return Array.from(String(s||'')).length;}

    /* 狀態標籤：一個狀態固定一組顏色（綠＝可以、紅＝不行、黃＝待處理、灰＝結束） */
    const STATUS_TAG={'待審核':'warn','已核准':'ok','審核不通過':'out','已取消':'mute','已結案':'mute'};
    function statusTag(s){return `<span class="tag-v2 ${STATUS_TAG[s]||'mute'}">${esc(s||'--')}</span>`;}

    /* ===== 通行證：存在 sessionStorage，關掉分頁就失效 =====
       嵌在 iframe 時部分瀏覽器會擋儲存空間，就退回只存在記憶體（重新整理頁面需重登） */
    const TOKEN_KEY='tvWallAdminToken';
    let TOKEN='';
    function loadToken(){try{return sessionStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';}}
    function saveToken(t){TOKEN=t||'';try{TOKEN?sessionStorage.setItem(TOKEN_KEY,TOKEN):sessionStorage.removeItem(TOKEN_KEY);}catch(e){}}

    /* 後台 API：自動帶上通行證；通行證失效就切回登入畫面，資料過期就自動重讀 */
    async function adminApi(fn,...args){
      try{return await api(fn,TOKEN,...args);}
      catch(e){
        if(e.message.indexOf('AUTH:')===0){const msg=e.message.slice(5);showLogin(msg);throw new Error(msg);}
        if(e.message.indexOf('STALE:')===0){
          const msg=e.message.slice(6);
          await refresh(false);          // 自動重讀一次
          if(openId)renderDetail(true);  // 抽屜依新資料重新帶入
          throw new Error(msg);
        }
        throw e;
      }
    }

    /* ===== 登入與登出 ===== */
    function showLogin(msg){
      saveToken('');
      document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'));
      openId=null;
      document.body.classList.add('locked');
      $('loginErr').textContent=msg||'';
      const pwd=$('loginPwd');pwd.value='';pwd.focus();
    }
    async function doLogin(){
      const pwd=$('loginPwd').value, err=$('loginErr');
      if(!pwd){err.textContent='請輸入密碼。';return;}
      const btn=$('btnLogin');
      btn.disabled=true;btn.textContent='處理中…';err.textContent='';
      try{
        const res=await api('adminLogin',pwd);
        saveToken(res.token);
        $('loginPwd').value='';
        document.body.classList.remove('locked');
        await refresh(false);
      }catch(e){err.textContent=e.message;$('loginPwd').select();}
      finally{btn.disabled=false;btn.textContent='登入';}
    }
    function logout(){
      const t=TOKEN;
      showLogin('已登出。');
      if(t)api('adminLogout',t).catch(()=>{});   // 伺服器端作廢通行證，不必等回應
    }

    /* ===== 全域狀態 ===== */
    let DATA=null;          // 後端資料
    let openId=null;        // 抽屜目前開啟的申請編號
    let shownLimit=100;     // 一次畫 100 筆
    let refreshing=false;

    /* ===== 側欄頁籤：count 大於 0 才顯示琥珀橘徽章 ===== */
    const TABS=[
      {id:'pending',label:'待審核',title:'待審核'},
      {id:'active',label:'已核准',title:'已核准（排程中與播放中）'},
      {id:'withdraw',label:'待撤檔',title:'待撤檔（核准後被取消）'},
      {id:'all',label:'全部申請',title:'全部申請'},
      {id:'logs',label:'處理紀錄',title:'處理紀錄'}
    ];
    let currentTab='pending';
    function tabCount(id){
      if(!DATA)return 0;
      const R=DATA.requests;
      if(id==='pending')return R.filter(r=>r.status==='待審核').length;
      if(id==='active')return R.filter(r=>r.expired).length;    // 已核准頁籤只在有過期未結案時提醒
      if(id==='withdraw')return R.filter(r=>r.needsWithdraw).length;
      return 0;
    }
    function renderNav(){
      $('nav').innerHTML=TABS.map(t=>{const c=tabCount(t.id);return `<button class="nav-btn${t.id===currentTab?' on':''}" onclick="switchTab('${t.id}')"><span>${t.label}</span>${c>0?`<span class="count">${c}</span>`:''}</button>`;}).join('');
    }
    function switchTab(id,preset){
      currentTab=id;shownLimit=100;
      $('statusFilter').classList.toggle('hidden',id!=='all');
      if(preset!==undefined)$('statusFilter').value=preset;
      renderAll();
    }
    function onFilterChange(){shownLimit=100;renderTable();}

    /* ===== KPI 與需要處理提示條 ===== */
    function renderKpis(){
      const R=DATA.requests, month=DATA.today.slice(0,7);
      const pending=R.filter(r=>r.status==='待審核');
      const urgent=pending.filter(r=>r.urgent);
      const playing=R.filter(r=>r.playing);
      const withdraw=R.filter(r=>r.needsWithdraw);
      const thisMonth=R.filter(r=>String(r.createdAt).slice(0,7)===month);
      const k=[
        ['待審核',pending.length,pending.length>0],
        ['急件待審',urgent.length,urgent.length>0],
        ['播放中',playing.length,false],
        ['待撤檔',withdraw.length,withdraw.length>0],
        ['本月申請',thisMonth.length,false]
      ];
      $('kpis').innerHTML=k.map(x=>`<div class="kpi${x[2]?' alert':''}"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');

      const expired=R.filter(r=>r.expired);
      const video=R.filter(r=>r.videoPending);
      const items=[];
      if(pending.length)items.push(`<span><strong>待審核 ${pending.length} 筆</strong>${urgent.length?`（急件 ${urgent.length}）`:''}　<a onclick="switchTab('pending')">前往審核</a></span>`);
      if(withdraw.length)items.push(`<span><strong>待撤檔 ${withdraw.length} 筆</strong>　<a onclick="switchTab('withdraw')">確認撤下</a></span>`);
      if(video.length)items.push(`<span><strong>影片未收到 ${video.length} 筆</strong>　<a onclick="switchTab('all','');$('searchBox').value='影片未收到';renderTable()">查看</a></span>`);
      if(expired.length)items.push(`<span><strong>下檔日已過未結案 ${expired.length} 筆</strong>　<a onclick="switchTab('active')">前往結案</a></span>`);
      $('attn').innerHTML=items.join('');
      $('attn').classList.toggle('hidden',!items.length);
    }

    /* ===== 表格 ===== */
    function matchSearch(r,kw){
      if(!kw)return true;
      if(kw==='影片未收到')return r.videoPending;   // 提示條的快捷篩選
      return [r.id,r.title,r.org,r.name,r.studentId,r.proxyFor,r.ticker].some(v=>String(v||'').toLowerCase().indexOf(kw)>=0);
    }
    function filteredRequests(){
      const kw=$('searchBox').value.trim().toLowerCase();
      let R=DATA.requests;
      if(currentTab==='pending')R=R.filter(r=>r.status==='待審核').sort((a,b)=>(b.urgent-a.urgent)||String(a.start).localeCompare(String(b.start))); // 急件與上檔日近的排前面
      else if(currentTab==='active')R=R.filter(r=>r.status==='已核准').sort((a,b)=>String(a.start).localeCompare(String(b.start)));
      else if(currentTab==='withdraw')R=R.filter(r=>r.needsWithdraw);
      else{const st=$('statusFilter').value;if(st)R=R.filter(r=>r.status===st);}
      return R.filter(r=>matchSearch(r,kw));
    }
    function itemsCell(r){
      const a=[];
      if(r.wantTv)a.push(`<span class="chip-v2 key">${licon('monitor')} 電視牆</span>`);
      if(r.wantTicker)a.push(`<span class="chip-v2 eq">${licon('type')} 跑馬燈</span>`);
      return a.join('');
    }
    function contentCell(r){
      const a=[];
      if(r.wantTv){
        if(r.mediaType==='圖片')a.push(r.hasImage?`<span class="sub">${licon('image','licon-sm')} 圖片 ${esc(r.imageSize||'')}</span>`:'<span class="sub" style="color:var(--out)">尚未上傳圖片</span>');
        else a.push(`<span class="sub">${licon('film','licon-sm')} 影片 ${r.videoReceived?'<span class="tag-v2 ok">已收到</span>':'<span class="tag-v2 warn">未收到</span>'}</span>`);
        a.push(`<span class="sub">${esc(r.duration)} 秒</span>`);
      }
      if(r.wantTicker)a.push(`<span class="sub clip" title="${esc(r.ticker)}">${esc(r.ticker)}</span>`);
      return a.join('')||'--';
    }
    function rowHtml(r){
      const cls=r.needsWithdraw?' class="row-blacklist"':(r.status==='已取消'||r.status==='已結案'?' class="row-disabled"':'');
      const actLabel=r.status==='待審核'?'審核':r.needsWithdraw?'確認撤檔':'檢視';
      return `<tr${cls}>
        <td><b>${esc(r.id)}</b><span class="sub">${esc(r.createdAt)}</span></td>
        <td><b>${esc(r.title)}</b><span class="sub">${esc(r.org)}${r.orgSource&&r.orgSource!=='名冊'?'（'+esc(r.orgSource)+'）':''} · ${esc(r.name)}（${esc(r.studentId)}）</span>${r.proxyFor?`<span class="sub">代 ${esc(r.proxyFor)}</span>`:''}</td>
        <td>${itemsCell(r)}</td>
        <td>${contentCell(r)}</td>
        <td class="nowrap">${esc(r.start)}<span class="sub">至 ${esc(r.end)}</span>${r.urgent?'<span class="tag-v2 warn">急件</span>':''}${r.playing?'<span class="tag-v2 ok">播放中</span>':''}</td>
        <td>${statusTag(r.status)}${r.needsWithdraw?'<span class="tag-v2 out">待撤檔</span>':''}${r.expired?'<span class="tag-v2 warn">已過下檔日</span>':''}${r.reviewNote?`<span class="sub clip" title="${esc(r.reviewNote)}">${esc(r.reviewNote)}</span>`:''}</td>
        <td><button class="btn-v2 ${r.status==='待審核'||r.needsWithdraw?'pri':'ghost'}" onclick="openDetail('${esc(r.id)}')">${actLabel}</button></td>
      </tr>`;
    }
    function emptyHtml(title,sub){
      return `<div class="empty"><div class="ico">${licon('inbox','licon-lg')}</div><h3>${title}</h3><p>${sub}</p></div>`;
    }
    function renderTable(){
      $('panelTitle').textContent=TABS.find(t=>t.id===currentTab).title;
      const expiredCount=DATA.requests.filter(r=>r.expired).length;
      $('btnExpire').classList.toggle('hidden',!(currentTab==='active'&&expiredCount>0));
      if(currentTab==='logs'){renderLogs();return;}
      const R=filteredRequests();
      if(!R.length){
        const kw=$('searchBox').value.trim();
        $('tableArea').innerHTML=kw?emptyHtml('找不到符合的申請','請調整搜尋文字或篩選條件。')
          :currentTab==='pending'?emptyHtml('目前沒有待審核的申請','新的申請送出後會出現在這裡。')
          :currentTab==='withdraw'?emptyHtml('沒有需要撤檔的申請','已核准的申請被取消時會出現在這裡。')
          :emptyHtml('目前沒有資料','申請送出後會出現在這裡。');
        return;
      }
      const shown=R.slice(0,shownLimit);
      $('tableArea').innerHTML=`<div class="table-wrap"><table class="table-v2">
        <thead><tr><th>申請編號</th><th>主題／單位·申請人</th><th>申請項目</th><th>內容</th><th>播放日期</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody>${shown.map(rowHtml).join('')}</tbody></table></div>
        <div class="more-bar">已顯示 ${shown.length} / ${R.length}${R.length>shown.length?' <button class="btn-v2 ghost" onclick="shownLimit+=100;renderTable()">顯示更多</button>':''}</div>`;
    }
    function renderLogs(){
      const kw=$('searchBox').value.trim().toLowerCase();
      const L=DATA.logs.filter(l=>!kw||[l.id,l.action,l.staff,l.note].some(v=>String(v||'').toLowerCase().indexOf(kw)>=0));
      if(!L.length){$('tableArea').innerHTML=emptyHtml(kw?'找不到符合的紀錄':'目前沒有處理紀錄',kw?'請調整搜尋文字。':'建立、審核、取消等動作都會記錄在這裡。');return;}
      const shown=L.slice(0,shownLimit);
      $('tableArea').innerHTML=`<div class="table-wrap"><table class="table-v2">
        <thead><tr><th>時間</th><th>申請編號</th><th>動作</th><th>處理人員</th><th>狀態變化</th><th>說明</th></tr></thead>
        <tbody>${shown.map(l=>`<tr><td class="nowrap">${esc(l.time)}</td><td><button class="link" onclick="openDetail('${esc(l.id)}')">${esc(l.id)}</button></td><td>${esc(l.action)}</td><td>${esc(l.staff)}</td>
          <td class="nowrap">${l.before&&l.before!==l.after?statusTag(l.before)+' → ':''}${l.after?statusTag(l.after):'--'}</td><td style="white-space:pre-wrap">${esc(l.note)||'--'}</td></tr>`).join('')}</tbody></table></div>
        <div class="more-bar">已顯示 ${shown.length} / ${L.length}（最近 500 筆）${L.length>shown.length?' <button class="btn-v2 ghost" onclick="shownLimit+=100;renderTable()">顯示更多</button>':''}</div>`;
    }
    function renderAll(){renderNav();renderKpis();renderTable();}

    /* ===== 詳細抽屜 ===== */
    const imageCache={};   // 申請編號|更新時間 → dataUrl
    function findReq(id){return DATA.requests.find(r=>r.id===id);}
    function staffOptions(){return '<option value="">請選擇</option>'+DATA.staff.map(s=>`<option>${esc(s)}</option>`).join('');}
    function dl(pairs){return '<dl class="dl">'+pairs.filter(p=>p).map(p=>`<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join('')+'</dl>';}

    function openDetail(id){
      if(!findReq(id)){showToast('找不到申請 '+id+'，請重新整理。','err');return;}
      openId=id;renderDetail(true);openOverlay('detailDrawer');
    }
    function closeDetail(){openId=null;closeOverlay('detailDrawer');}

    /* resetInputs 為 true：依資料重新帶入，所有欄位清空（處理人員每次重選） */
    function renderDetail(resetInputs){
      const r=findReq(openId);
      if(!r){closeDetail();return;}
      if(!resetInputs)return;
      $('dEyebrow').textContent=r.status==='待審核'?'REVIEW REQUEST':'REQUEST DETAIL';
      $('dTitle').textContent=r.title;
      $('dSub').textContent=r.id+'　'+r.status;

      let tv='';
      if(r.wantTv){
        let media='';
        if(r.mediaType==='圖片'){
          media=r.hasImage?`<div class="img-preview show" id="dImgBox"><div class="loading" style="padding:24px">讀取圖片中…</div></div>
            <div class="img-meta"><span class="chip-v2 eq">${esc(r.imageSize||'--')}</span><span class="chip-v2 eq">${esc(r.imageName||'')}</span><span id="dImgLink"></span></div>`
            :'<span class="tag-v2 out">申請人尚未上傳圖片</span>';
        }else{
          media=`${r.videoLink?`<a href="${esc(r.videoLink)}" target="_blank" rel="noopener" class="link">${licon('external-link','licon-sm')} 開啟影片連結</a><br>`:''}
            ${r.videoMailed?'<span class="sub">申請人表示已用 E-mail 寄出</span>':''}
            <div style="margin-top:8px">${r.videoReceived?'<span class="tag-v2 ok">院辦已收到影片</span>':'<span class="tag-v2 warn">院辦尚未收到影片</span>'}</div>`;
        }
        tv=`<p class="sec-title">電視牆</p>`+dl([['檔案類型',esc(r.mediaType)],['播放長度',esc(r.duration)+' 秒'],['檔案',media]]);
      }
      const tk=r.wantTicker?`<p class="sec-title">跑馬燈</p>`+dl([['內容',esc(r.ticker)],['字數',charLen(r.ticker)+' / 50']]):'';

      $('dBody').innerHTML=
        `<p class="sec-title">申請人</p>`+dl([
          ['姓名',esc(r.name)],['學號',esc(r.studentId)],
          ['申請單位',esc(r.org)+(r.orgSource==='自填'?' <span class="tag-v2 warn">自填，請核對</span>':r.orgSource==='自行登錄'?' <span class="tag-v2 warn">申請人自行登錄名冊，請核對身分與單位</span>':'')],
          ['申請方式',esc(r.mode)],r.proxyFor?['代申請對象',esc(r.proxyFor)]:null,
          ['申請時間',esc(r.createdAt)]
        ])+
        `<p class="sec-title">播放</p>`+dl([
          ['播放日期',esc(r.start)+' 至 '+esc(r.end)],
          ['提前天數',esc(r.leadDays)+' 天'+(r.urgent?' <span class="tag-v2 warn">急件</span>':'')],
          ['申請項目',itemsCell(r)]
        ])+tv+tk+
        `<p class="sec-title">申請人備註</p>`+dl([['備註',r.notes?esc(r.notes):'<span class="muted">--</span>']])+
        `<p class="sec-title">處理狀態</p>`+dl([
          ['狀態',statusTag(r.status)],
          r.reviewedAt?['審核',esc(r.reviewer)+'　'+esc(r.reviewedAt)]:null,
          r.reviewNote?['審核備註',esc(r.reviewNote)]:null,
          r.cancelledAt?['取消時間',esc(r.cancelledAt)+(r.cancelledAfterApproval?' <span class="tag-v2 out">核准後取消</span>':'')]:null,
          r.withdrawAt?['撤檔確認',esc(r.withdrawBy)+'　'+esc(r.withdrawAt)]:null,
          r.completedAt?['結案時間',esc(r.completedAt)]:null
        ])+actionHtml(r);

      $('dFoot').innerHTML=footHtml(r);
      if(r.wantTv&&r.mediaType==='圖片'&&r.hasImage)loadPreview(r);
    }

    /* 依狀態產生操作區 */
    function actionHtml(r){
      const staff=`<div class="field-group"><label class="field-label" for="aStaff">處理人員 *</label><select id="aStaff">${staffOptions()}</select></div>`;
      if(r.status==='待審核'){
        return `<p class="sec-title">審核</p>
          <div class="field-group"><label class="field-label">審核結果 *</label>
            <div class="radio-group-v2">
              <label class="radio-v2"><input type="radio" name="decision" value="approve"><span><b>通過</b><small>申請人會看到「已核准」，院辦依日期安排上檔</small></span></label>
              <label class="radio-v2"><input type="radio" name="decision" value="reject"><span><b>不通過</b><small>必須填寫原因，申請人會看到這段說明</small></span></label>
            </div></div>
          <div class="field-group"><label class="field-label" for="aNote">審核備註</label>
            <textarea id="aNote" rows="3" maxlength="500" placeholder="不通過時必填，例如：圖片含未授權素材，請更換後重新申請。"></textarea>
            <p class="field-help">申請人在「查詢進度」看得到，名冊有信箱時也會寄信通知。</p></div>`+staff;
      }
      if(r.needsWithdraw){
        return `<p class="sec-title">撤檔確認</p><div class="attn"><span><strong>已核准的申請被取消</strong>　若內容已排上電視牆或跑馬燈，請撤下後再確認。</span></div>`+staff;
      }
      if(r.status==='已核准'){
        const video=r.wantTv&&r.mediaType==='影片'
          ?`<div class="field-group"><label class="check-v2"><input type="checkbox" id="aVideo"${r.videoReceived?' checked':''}><span class="check-box"></span><span class="check-text"><b>院辦已收到影片</b><small>改變勾選後按「儲存影片狀態」</small></span></label></div>`:'';
        return `<p class="sec-title">處理</p>`+video+`<p class="field-help">下檔日過後系統會自動結案；需要提前結束時可手動結案。</p>`+staff;
      }
      return '';
    }
    function footHtml(r){
      const close='<button class="btn-v2 ghost" onclick="closeDetail()">關閉</button>';
      if(r.status==='待審核'){
        return `<button class="btn-v2 pri" id="btnReview" onclick="submitReview()">送出審核</button>`+close;
      }
      if(r.needsWithdraw)return `<button class="btn-v2 pri" id="btnWithdraw" onclick="doAction('acknowledgeWithdraw','btnWithdraw','已確認撤檔。')">確認已撤檔</button>`+close;
      if(r.status==='已核准'){
        const video=r.wantTv&&r.mediaType==='影片'?`<button class="btn-v2 ghost" id="btnVideo" onclick="saveVideo()">儲存影片狀態</button>`:'';
        return `<button class="btn-v2 pri" id="btnComplete" onclick="doAction('completeRequest','btnComplete','已結案。')">手動結案</button>`+video+close;
      }
      return close;
    }

    /* 圖片預覽：同一版本只讀一次 */
    async function loadPreview(r){
      const key=r.id+'|'+r.updatedAt;
      try{
        const res=imageCache[key]||(imageCache[key]=await adminApi('getImagePreview',r.id));
        if(openId!==r.id||!$('dImgBox'))return;
        $('dImgBox').innerHTML=`<img src="${res.dataUrl}" alt="申請圖片">`;
        $('dImgLink').innerHTML=`<a class="link" href="${esc(res.url)}" target="_blank" rel="noopener">${licon('external-link','licon-sm')} 開啟雲端原檔</a>`;
      }catch(e){
        delete imageCache[key];
        if($('dImgBox'))$('dImgBox').innerHTML=`<div class="loading" style="padding:24px">${esc(e.message)}</div>`;
      }
    }

    /* ===== 寫入操作 ===== */
    function needStaff(){
      const s=$('aStaff')?$('aStaff').value:'';
      if(!s)showToast('請選擇處理人員。','err');
      return s;
    }
    async function submitReview(){
      const r=findReq(openId);
      const d=document.querySelector('input[name=decision]:checked');
      const note=$('aNote').value.trim();
      if(!d){showToast('請選擇審核結果。','err');return;}
      if(d.value==='reject'&&!note){showToast('審核不通過時請填寫原因，申請人會看到這段說明。','err');return;}
      const staff=needStaff();if(!staff)return;
      const done=busy($('btnReview'));
      try{
        await adminApi('reviewRequest',{id:r.id,decision:d.value,note:note,staff:staff,expectedUpdatedAt:r.updatedAt});
        showToast(d.value==='approve'?'已核准 '+r.id+'。':'已設為審核不通過 '+r.id+'。','ok');
        closeDetail();await refresh(false);
      }catch(e){showToast(e.message,'err');}
      finally{if($('btnReview'))done();}
    }
    async function doAction(fn,btnId,okMsg){
      const r=findReq(openId);
      const staff=needStaff();if(!staff)return;
      const done=busy($(btnId));
      try{
        await adminApi(fn,{id:r.id,staff:staff,expectedUpdatedAt:r.updatedAt});
        showToast(okMsg,'ok');closeDetail();await refresh(false);
      }catch(e){showToast(e.message,'err');}
      finally{if($(btnId))done();}
    }
    async function saveVideo(){
      const r=findReq(openId);
      const staff=needStaff();if(!staff)return;
      const done=busy($('btnVideo'));
      try{
        await adminApi('setVideoReceived',{id:r.id,staff:staff,received:$('aVideo').checked,expectedUpdatedAt:r.updatedAt});
        showToast($('aVideo').checked?'已標記影片已收到。':'已取消影片已收到。','ok');
        await refresh(false);renderDetail(true);
      }catch(e){showToast(e.message,'err');}
      finally{if($('btnVideo'))done();}
    }

    /* ===== 結案過期檔期 ===== */
    function openExpireModal(){
      $('exCount').textContent=DATA.requests.filter(r=>r.expired).length;
      $('exStaff').innerHTML=staffOptions();   // 每次重選處理人員
      openOverlay('expireModal');
    }
    async function confirmExpire(){
      const staff=$('exStaff').value;
      if(!staff){showToast('請選擇處理人員。','err');return;}
      const done=busy($('btnExConfirm'));
      try{
        const r=await adminApi('completeExpiredRequests',{staff:staff});
        closeOverlay('expireModal');showToast('已結案 '+r.count+' 筆。','ok');await refresh(false);
      }catch(e){showToast(e.message,'err');}
      finally{done();}
    }

    /* ===== 重新整理 =====
       背景更新只重畫 KPI、側欄與表格；抽屜內的欄位不動，避免清掉正在填的審核備註。 */
    async function refresh(manual){
      if(refreshing)return;
      refreshing=true;
      try{
        DATA=await adminApi('getAdminData');
        $('sysName').textContent=DATA.systemName+' 管理後台';
        $('lastUpdated').textContent='最後更新 '+new Date().toLocaleTimeString('zh-TW',{hour12:false});
        $('bootLoading').classList.add('hidden');$('appBody').classList.remove('hidden');
        renderAll();
        if(openId&&!findReq(openId))closeDetail();
        if(manual)showToast('資料已更新。','info');
      }catch(e){
        if(document.body.classList.contains('locked'))return;
        if(!DATA){$('bootLoading').innerHTML=`<div class="empty"><div class="ico">${licon('triangle-alert','licon-lg')}</div><h3>無法讀取資料</h3><p>${esc(e.message)}</p></div>`;}
        else if(manual)showToast(e.message,'err');
      }finally{refreshing=false;}
    }

    /* ===== 初始化：有通行證就直接讀資料，失效時 adminApi 會自動切回登入畫面 ===== */
    renderNav();hydrateIcons();
    // 每 15 秒背景更新；分頁在背景、未登入時暫停
    setInterval(()=>{if(!document.hidden&&DATA&&TOKEN&&!document.body.classList.contains('locked'))refresh(false);},15000);
    TOKEN=loadToken();
    if(TOKEN)refresh(false);
    else showLogin('');
  </script>
</body>
</html>
